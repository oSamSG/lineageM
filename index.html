  Store.load=()=>{try{return JSON.parse(localStorage.getItem(SAVE_KEY)||localStorage.getItem('lm_core_rebuild_v42_mapbook_fix')||localStorage.getItem('lm_core_rebuild_v41_mapbook_rules')||localStorage.getItem('lm_core_rebuild_v40_refresh_fix')||localStorage.getItem('lm_core_rebuild_v37_clean')||localStorage.getItem('lm_core_rebuild_v33_equipped_guard')||localStorage.getItem('lm_core_rebuild_v16_official_balance')||localStorage.getItem('lm_core_rebuild_v15')||localStorage.getItem('lm_all_in_one_v1')||'null')}catch{return oldStoreLoad();}};
  Store.clear=()=>{[SAVE_KEY,'lm_core_rebuild_v42_mapbook_fix','lm_core_rebuild_v41_mapbook_rules','lm_core_rebuild_v40_refresh_fix','lm_core_rebuild_v37_clean','lm_core_rebuild_v33_equipped_guard','lm_core_rebuild_v16_official_balance','lm_core_rebuild_v15','lm_all_in_one_v1'].forEach(k=>localStorage.removeItem(k)); try{oldStoreClear();}catch(e){}};

  mat('v43_weapon_core',{name:'武器分解核心',rank:'R',price:900,group:'武器材料',desc:'由武器分解取得，用於武器製作與進階強化。'});
  mat('v43_armor_core',{name:'防具分解核心',rank:'R',price:750,group:'防具材料',desc:'由防具分解取得，用於防具製作與進階強化。'});
  mat('v43_acc_core',{name:'飾品分解核心',rank:'R',price:1100,group:'飾品材料',desc:'由飾品分解取得，用於飾品、符石、印章製作。'});
  mat('v43_magic_dust',{name:'魔法殘粉',rank:'N',price:120,group:'通用材料',desc:'所有裝備分解皆可取得的基礎材料。'});
  mat('v43_bless_dust',{name:'祝福殘粉',rank:'SR',price:1800,group:'祝福材料',desc:'高階或高強化裝備分解取得，可轉化為祝福粉末。'});
  mat('v43_hero_essence',{name:'英雄分解精華',rank:'SSR',price:6000,group:'高階材料',desc:'英雄級以上裝備分解取得。'});
  mat('v43_legend_essence',{name:'傳說分解精華',rank:'L',price:18000,group:'高階材料',desc:'傳說級以上裝備分解取得。'});
  mat('v43_myth_essence',{name:'神話分解精華',rank:'M',price:60000,group:'高階材料',desc:'神話裝備分解取得。'});
  if(!DB.item.m18_powder) mat('m18_powder',{name:'祝福粉末',rank:'R',price:650,group:'祝福材料'});
  if(!DB.item.m18_weapon_frag) mat('m18_weapon_frag',{name:'武器碎片',rank:'N',price:300,group:'武器材料'});
  if(!DB.item.m18_armor_frag) mat('m18_armor_frag',{name:'防具碎片',rank:'N',price:250,group:'防具材料'});
  if(!DB.item.m18_acc_frag) mat('m18_acc_frag',{name:'飾品碎片',rank:'R',price:450,group:'飾品材料'});
  if(!DB.item.m18_relic_piece) mat('m18_relic_piece',{name:'聖物碎片',rank:'SR',price:1200,group:'聖物材料'});

  const oldEnsure=Game.ensure.bind(Game);
  Game.ensure=function(){ oldEnsure(); if(this.s){ this.s.version='core_rebuild_v43_material_recycle'; this.s.disassembleLog=this.s.disassembleLog||[]; } };

  Game.disassembleBaseMaterial=function(d){
    if(d.type==='weapon') return ['m18_weapon_frag','v43_weapon_core'];
    if(armorTypes.includes(d.type)) return ['m18_armor_frag','v43_armor_core'];
    if(accTypes.includes(d.type)) return ['m18_acc_frag','v43_acc_core'];
    if(specialTypes.includes(d.type)) return ['m18_relic_piece','v43_acc_core'];
    return ['v43_magic_dust'];
  };

  Game.disassembleRewards=function(k){
    const it=this.inv(k), d=it&&this.def(it.id); if(!it||!d) return [];
    if(!equipTypes.includes(d.type)) return [];
    const rv=rankValue(d.rank), ench=Math.max(0,Number(it.enchant)||0);
    const rankBase={N:3,R:6,SR:12,SSR:24,L:55,M:140}[d.rank]||3;
    const enchantBonus=ench>0?Math.ceil(rankBase*(ench*0.22))+ench*rv:0;
    const qty=Math.max(1,rankBase+enchantBonus);
    const [frag,core]=this.disassembleBaseMaterial(d);
    const out=[];
    out.push([frag,qty]);
    out.push(['v43_magic_dust',Math.max(1,Math.ceil(qty*0.45))]);
    if(rv>=2) out.push([core,Math.max(1,Math.ceil(qty/(rv>=5?5:6)))]);
    if(ench>=5) out.push(['v43_bless_dust',Math.max(1,Math.floor((ench-4)*rv))]);
    if(rv>=4) out.push(['v43_hero_essence',Math.max(1,rv-3)]);
    if(rv>=5) out.push(['v43_legend_essence',Math.max(1,ench>=7?2:1)]);
    if(rv>=6) out.push(['v43_myth_essence',Math.max(1,ench>=7?2:1)]);
    if(DB.item.m18_powder && (rv>=3||ench>=4)) out.push(['m18_powder',Math.max(1,Math.floor(rv*rv/2)+Math.max(0,ench-3)*rv)]);
    return out.filter(([id,q])=>DB.item[id]&&q>0);
  };

  Game.disassemblePreview=function(k){
    const rewards=this.disassembleRewards(k);
    return rewards.length?rewards.map(([id,q])=>`${this.def(id)?.name||id} ×${q}`).join('、'):'不可分解';
  };

  Game.disassemble=function(k){
    const it=this.inv(k), d=it&&this.def(it.id);
    if(!it||!d) return;
    if(this.isEquippedKey&&this.isEquippedKey(k)){ alert('此裝備正在穿戴中，請先卸下後再分解。'); this.log('阻止分解已裝備道具：'+d.name,'red'); this.render(); return; }
    if(!equipTypes.includes(d.type)){ alert('此道具不可分解'); return; }
    const rewards=this.disassembleRewards(k);
    if(!rewards.length){ alert('此道具沒有可回收材料'); return; }
    rewards.forEach(([id,q])=>this.addItem(id,q,0));
    this.rem(k,1);
    const line=`分解 ${d.enchant?`+${it.enchant} `:''}${d.name} → ${rewards.map(([id,q])=>(this.def(id)?.name||id)+' ×'+q).join('、')}`;
    this.s.disassembleLog=this.s.disassembleLog||[];
    this.s.disassembleLog.unshift({t:Date.now(),item:d.name,rank:d.rank,enchant:it.enchant||0,rewards:rewards.map(([id,q])=>({id,qty:q}))});
    this.s.disassembleLog=this.s.disassembleLog.slice(0,30);
    this.log(line,'green');
    this.save(false); this.render();
  };

  Game.disassembleByRank=function(maxRank='R'){
    const max=rankValue(maxRank); let count=0;
    const locked=this.equippedKeys?this.equippedKeys():new Set(Object.values(this.s.equip||{}).filter(Boolean));
    Object.keys(this.s.inv||{}).slice().forEach(k=>{
      if(locked.has(k)) return;
      const it=this.inv(k), d=it&&this.def(it.id);
      if(!d||!equipTypes.includes(d.type)) return;
      if(rankValue(d.rank)>max) return;
      this.disassemble(k); count++;
    });
    if(!count) alert('沒有符合條件的未穿戴裝備可分解。');
    else { this.log(`批次分解完成：${count} 件 ${R[maxRank]?.[0]||maxRank} 以下裝備`,'green'); this.render(); }
  };

  Game.materialRecycleSummary=function(){
    const ids=['m18_weapon_frag','m18_armor_frag','m18_acc_frag','m18_relic_piece','v43_weapon_core','v43_armor_core','v43_acc_core','v43_magic_dust','v43_bless_dust','m18_powder','v43_hero_essence','v43_legend_essence','v43_myth_essence'];
    return ids.filter(id=>DB.item[id]).map(id=>`<div class="mini"><span class="r-${DB.item[id].rank}">${esc(DB.item[id].name)}</span><br><span class="muted">持有 ${this.countItem?this.countItem(id):0}</span></div>`).join('');
  };

  const oldAction=Game.action.bind(Game);
  Game.action=function(a,arg,b){
    if(a==='dis') return this.disassemble(arg);
    if(a==='disRank') return this.disassembleByRank(arg||'R');
    return oldAction(a,arg,b);
  };

  if(Game.itemCard){
    const oldItemCard=Game.itemCard.bind(Game);
    Game.itemCard=function(k,mode='bag'){
      let html=oldItemCard(k,mode);
      const it=this.inv(k), d=it&&this.def(it.id);
      if(it&&d&&equipTypes.includes(d.type)&&!(this.isEquippedKey&&this.isEquippedKey(k))){
        const preview=esc(this.disassemblePreview(k));
        html=html.replace(/<button data-act="dis" data-arg="([^"]+)">分解<\/button>/,`<button data-act="dis" data-arg="$1" title="${preview}">分解材料</button>`);
        html=html.replace(/<\/div>\s*<\/div>$/,'<div class="mini green">分解預覽：'+preview+'</div></div>');
      }
      return html;
    };
  }

  const oldViewBag=Game.viewBag.bind(Game);
  Game.viewBag=function(){
    const base=oldViewBag();
    const tools=`<div class="card"><div class="row"><b class="gold">V43 分解材料工具</b><span class="muted">只處理未穿戴裝備</span></div><div style="margin-top:8px"><button data-act="disRank" data-arg="N">批次分解一般</button> <button data-act="disRank" data-arg="R">批次分解高級以下</button> <button data-act="disRank" data-arg="SR">批次分解稀有以下</button></div><div class="grid cards" style="margin-top:8px">${this.materialRecycleSummary()}</div></div>`;
    return base.replace('<h3 class="title">背包</h3>','<h3 class="title">背包 / 分解材料</h3>'+tools);
  };

  const oldViewCraft=Game.viewCraft.bind(Game);
  Game.viewCraft=function(){
    return oldViewCraft()+`<div class="card"><b class="gold">V43 分解材料規則</b><br><span class="muted">武器、防具、飾品、符石、印章、聖物會回收不同核心材料；品階越高、強化越高，回收量越多。英雄以上追加精華，+5 以上追加祝福殘粉。</span><div class="grid cards" style="margin-top:8px">${this.materialRecycleSummary()}</div></div>`;
  };

  const oldViewDash=Game.viewDash.bind(Game);
  Game.viewDash=function(){
    return oldViewDash()+`<div class="card"><b class="gold">V43 版本整理</b><br><span class="muted">目前公開版本統一為 V43；舊版補丁保留為 Legacy Layer，避免破壞既有存檔與功能。新增分解材料預覽、批次分解、品階/強化值回收倍率。</span></div>`;
  };

  const oldViewAudit=Game.viewAudit.bind(Game);
  Game.viewAudit=function(){
    const materials=Object.values(DB.item).filter(i=>i.type==='material').length;
    return oldViewAudit()+`<div class="card"><b class="gold">V43 整理檢查</b><br><span class="muted">目前版本：${APP_VERSION}<br>已整理舊版標籤為 Legacy Layer：${DB.versionHistory.previous.join('、')}<br>分解材料種類：${materials}<br>分解保護：已裝備道具不可分解/賣出；批次分解只處理未穿戴裝備。</span></div>`;
  };

  const oldRenderStatus=Game.renderStatus.bind(Game);
  Game.renderStatus=function(){
    oldRenderStatus();
    const t=document.querySelector('#app .top .title'); if(t) t.textContent='天堂M Core Rebuild V43｜分解材料優化版';
    const sub=this.$&&this.$('subtitle'); if(sub&&this.s) sub.textContent=(sub.textContent||'').replace(/V\d+(?:\.\d+)?/g,'V43');
  };

  window.addEventListener('DOMContentLoaded',()=>{
    document.title='天堂M Core Rebuild V43｜分解材料優化版';
    setText('#start h1','天堂M Core Rebuild V43');
    setText('#app .top .title','天堂M Core Rebuild V43｜分解材料優化版');
  });
})();

</script>



<!-- === V43.2 MONSTER/BOSS CODEX BUTTON UNIFICATION === -->
<script>
(function(){
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const num=n=>Math.floor(Number(n)||0).toLocaleString();
  const uniq=a=>[...new Set((a||[]).filter(Boolean))];
  const bossRe=/王|Boss|BOSS|龍|安塔|巴拉|法利|林德|吉爾|巴風|死亡騎士|巫妖|木乃伊|吸血鬼|巨蟻|不死鳥|惡魔|克特|賽尼斯|首領|君主/i;
  const itemName=id=>(DB.item&&DB.item[id]&&DB.item[id].name)||id;

  function ensureCss(){
    if(document.getElementById('v432-codex-css')) return;
    const css=document.createElement('style'); css.id='v432-codex-css';
    css.textContent=`
      .codex-v432-card{background:#081120;border:1px solid #26364e;border-radius:13px;padding:12px}
      .codex-v432-card.ready{border-color:#fca5a5;background:#1a1014}.codex-v432-card.done{border-color:var(--gold);background:#16180d}.codex-v432-card.active{border-color:#60a5fa}.codex-v432-card.locked{opacity:.75;border-style:dashed}
      .codex-v432-progress{height:22px;background:#030814;border:1px solid #41516a;border-radius:99px;overflow:hidden;position:relative;margin:10px 0}
      .codex-v432-progress span{display:block;height:100%;background:linear-gradient(90deg,#1e3a8a,#22c55e,#facc15)}
      .codex-v432-progress b{position:absolute;inset:0;text-align:center;line-height:20px;font-size:12px;text-shadow:1px 1px 2px #000}
      .codex-v432-sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;color:var(--muted);font-size:12px;margin-bottom:8px}
      .codex-v432-card details{margin-top:8px}.codex-v432-card summary{cursor:pointer;color:var(--gold)}
      .codex-v432-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    `;
    document.head.appendChild(css);
  }

  function monsterMaps(name){return (DB.maps||[]).filter(m=>(m.mons||[]).includes(name));}
  function monsterDrops(name){return uniq(monsterMaps(name).flatMap(m=>(m.drops||[]).concat(m.materialDrops||[]))).slice(0,12);}
  function isBossName(name){return bossRe.test(String(name||''));}
  function allMonsterNames(){return uniq((DB.maps||[]).flatMap(m=>m.mons||[])).sort((a,b)=>String(a).localeCompare(String(b),'zh-Hant'));}
  function allBossNames(){
    const fromBoss=(DB.bosses||[]).map(b=>b.name);
    const fromMap=allMonsterNames().filter(isBossName);
    const fromCodex=Object.keys((Game.s&&Game.s.codexBoss)||{});
    return uniq(fromBoss.concat(fromMap).concat(fromCodex)).sort((a,b)=>String(a).localeCompare(String(b),'zh-Hant'));
  }
  function bossData(name){return (DB.bosses||[]).find(b=>b.name===name)||null;}
  function bossMaps(name){
    const b=bossData(name);
    let maps=(DB.maps||[]).filter(m=>(m.mons||[]).includes(name));
    if(b){
      maps=maps.concat((DB.maps||[]).filter(m=>{
        const label=((m.id||'')+' '+(m.name||'')).toLowerCase();
        const zone=String(b.zone||'').toLowerCase();
        return zone && (label.includes(zone)||zone.includes(String(m.id||'').toLowerCase()));
      }));
    }
    if(!maps.length && b){maps=(DB.maps||[]).filter(m=>Math.abs((m.min||0)-(b.lv||0))<=12).slice(0,3);}
    return uniq(maps.map(m=>m.id)).map(id=>(DB.maps||[]).find(m=>m.id===id)).filter(Boolean);
  }
  function bossDrops(name){return uniq(bossMaps(name).flatMap(m=>(m.drops||[]).concat(m.materialDrops||[]))).slice(0,12);}
  function rankClassByProgress(p){return p>=100?'done':p>=80?'ready':p>0?'active':'locked';}
  function firstMapIdForMonster(name){const m=monsterMaps(name)[0]; return m&&m.id;}
  function firstMapIdForBoss(name){const m=bossMaps(name)[0]; return m&&m.id;}
  function setMapAndRender(game,mapId){
    if(!mapId) return false;
    game.ensure&&game.ensure();
    if(!(DB.maps||[]).some(m=>m.id===mapId)) return false;
    game.s.map=mapId; game.s.mon=null;
    if(game.discoverMapV31) game.discoverMapV31(mapId,3,true);
    game.save&&game.save(false); game.render&&game.render();
    return true;
  }

  const oldEnsure=Game.ensure;
  Game.ensure=function(){
    oldEnsure.call(this);
    if(!this.s) return;
    this.s.codexMon=this.s.codexMon||{};
    this.s.codexBoss=this.s.codexBoss||{};
    this.s.claimed=this.s.claimed||{};
    this.s.codexFilter=this.s.codexFilter||{monster:'all',boss:'all'};
    this.s.codexSort=this.s.codexSort||{monster:'progress',boss:'progress'};
  };

  const oldAction=Game.action;
  Game.action=function(a,arg,b){
    if(a==='monsterBookFilterV432'){this.ensure();this.s.codexFilter.monster=arg||'all';this.renderTab();return;}
    if(a==='monsterBookSortV432'){this.ensure();this.s.codexSort.monster=arg||'progress';this.renderTab();return;}
    if(a==='bossBookFilterV432'){this.ensure();this.s.codexFilter.boss=arg||'all';this.renderTab();return;}
    if(a==='bossBookSortV432'){this.ensure();this.s.codexSort.boss=arg||'progress';this.renderTab();return;}
    if(a==='goMonsterMapV432'){
      const ok=setMapAndRender(this,firstMapIdForMonster(arg));
      if(!ok) alert('找不到此怪物對應地圖。');
      return;
    }
    if(a==='goBossMapV432'){
      const ok=setMapAndRender(this,firstMapIdForBoss(arg));
      if(!ok) alert('找不到此 Boss 對應地圖。');
      return;
    }
    if(a==='targetMonsterV432'){
      this.ensure();
      const mapId=firstMapIdForMonster(arg);
      if(mapId) this.s.map=mapId;
      const map=(DB.maps||[]).find(m=>m.id===this.s.map);
      const lv=map?Math.max(map.min||1,Math.min(map.max||99,this.s.lv||1)):this.s.lv||1;
      this.s.mon={name:arg,lv,boss:isBossName(arg),hp:Math.floor((isBossName(arg)?1200:120)+lv*(isBossName(arg)?70:22)),max:0,map:this.s.map};
      this.s.mon.max=this.s.mon.hp;
      if(this.discoverMapV31&&mapId) this.discoverMapV31(mapId,3,true);
      this.log('怪物圖鑑指定目標：'+arg,'green');
      this.render();return;
    }
    if(a==='fightBossBookV432'){
      this.ensure();
      const bd=bossData(arg);
      if(bd&&this.boss){this.boss(bd.id);return;}
      const mapId=firstMapIdForBoss(arg);
      if(mapId) this.s.map=mapId;
      const lv=(bd&&bd.lv)||this.s.lv||1;
      this.s.mon={name:arg,lv,boss:true,hp:(bd&&bd.hp)||Math.floor(1200+lv*70),max:(bd&&bd.hp)||Math.floor(1200+lv*70),map:this.s.map};
      this.log('BOSS圖鑑指定目標：'+arg,'green');
      this.render();return;
    }
    return oldAction.call(this,a,arg,b);
  };

  Game.viewMonsterBookV23=function(){
    this.ensure(); ensureCss();
    const filter=this.s.codexFilter?.monster||'all', sort=this.s.codexSort?.monster||'progress';
    const filters=[['all','全部'],['current','目前地圖'],['unseen','未登錄'],['ready','可領獎'],['claimed','已完成']];
    const sorts=[['progress','進度'],['kills','擊殺'],['level','地圖等級'],['name','名稱']];
    const all=allMonsterNames();
    let list=all.slice().filter(n=>{
      const k=this.s.codexMon?.[n]||0, ready=k>=100&&!this.s.claimed?.['mon_'+n], claimed=!!this.s.claimed?.['mon_'+n];
      if(filter==='current') return (this.map().mons||[]).includes(n);
      if(filter==='unseen') return k<=0;
      if(filter==='ready') return ready;
      if(filter==='claimed') return claimed;
      return true;
    });
    list.sort((a,b)=>{
      const ka=this.s.codexMon?.[a]||0, kb=this.s.codexMon?.[b]||0;
      if(sort==='kills') return kb-ka;
      if(sort==='level') return ((monsterMaps(a)[0]?.min)||999)-((monsterMaps(b)[0]?.min)||999);
      if(sort==='name') return String(a).localeCompare(String(b),'zh-Hant');
      return Math.min(100,kb)-Math.min(100,ka);
    });
    const done=all.filter(n=>(this.s.codexMon?.[n]||0)>=100).length;
    const ready=all.filter(n=>(this.s.codexMon?.[n]||0)>=100&&!this.s.claimed?.['mon_'+n]).length;
    const totalKills=Object.values(this.s.codexMon||{}).reduce((a,b)=>a+(Number(b)||0),0);
    const current=(this.map().mons||[]).length;
    const rows=list.map(n=>{
      const k=this.s.codexMon?.[n]||0, pct=Math.min(100,Math.floor(k/100*100)), claimed=!!this.s.claimed?.['mon_'+n], can=k>=100&&!claimed;
      const maps=monsterMaps(n), first=maps[0];
      const drops=monsterDrops(n).map(id=>`<span class="pill">${esc(itemName(id))}</span>`).join('')||'<span class="muted">無掉落資料</span>';
      const mapPills=maps.slice(0,8).map(m=>`<span class="pill ${m.id===this.s.map?'blue':''}">${esc(m.name)} Lv.${m.min}-${m.max}</span>`).join('')||'<span class="muted">無地圖資料</span>';
      return `<div class="codex-v432-card ${rankClassByProgress(pct)}">
        <div class="row"><div><b class="gold">${esc(n)}</b> ${claimed?'<span class="pill green">已完成</span>':can?'<span class="pill red">可領獎</span>':k>0?'<span class="pill blue">已登錄</span>':'<span class="pill muted">未登錄</span>'}<br><span class="muted">擊殺 ${num(k)}/100｜主要地圖：${first?esc(first.name):'無'}</span></div><div class="codex-v432-actions"><button data-act="goMonsterMapV432" data-arg="${esc(n)}" ${first?'':'disabled'}>前往</button><button data-act="targetMonsterV432" data-arg="${esc(n)}" ${first?'':'disabled'}>指定目標</button><button data-act="claimMonBook" data-arg="${esc(n)}" ${can?'':'disabled'}>領取</button></div></div>
        <div class="codex-v432-progress"><span style="width:${pct}%"></span><b>${pct}%</b></div>
        <div class="codex-v432-sub"><span>擊殺 ${num(k)}</span><span>出沒地圖 ${maps.length}</span><span>掉落 ${monsterDrops(n).length}</span></div>
        <details><summary>地圖 / 掉落</summary><div class="drop-box"><b>出沒地圖</b>${mapPills}</div><div class="drop-box"><b>掉落</b>${drops}</div></details>
      </div>`;
    }).join('');
    return this.hero('怪物圖鑑 V43.2','操作按鈕已統一為地圖圖鑑模式：篩選、排序、前往、指定目標、領取。')+
      this.statCards([['怪物種類',all.length,'gold'],['目前地圖怪物',current,'cyan'],['可領獎',ready,'red'],['已完成',done+'/'+all.length,'green'],['總擊殺',num(totalKills),'blue']])+
      `<div class="tabs page-tabs">${filters.map(([id,n])=>`<button class="tab ${filter===id?'on':''}" data-act="monsterBookFilterV432" data-arg="${id}">${n}</button>`).join('')}</div>`+
      `<div class="tabs page-tabs">${sorts.map(([id,n])=>`<button class="tab ${sort===id?'on':''}" data-act="monsterBookSortV432" data-arg="${id}">排序：${n}</button>`).join('')}</div>`+
      `<div class="page-list">${rows||'<p class="muted">沒有符合條件的怪物</p>'}</div>`;
  };

  Game.viewBossBookV23=function(){
    this.ensure(); ensureCss();
    const filter=this.s.codexFilter?.boss||'all', sort=this.s.codexSort?.boss||'progress';
    const filters=[['all','全部'],['current','目前地圖'],['unseen','未討伐'],['ready','可領獎'],['claimed','已完成']];
    const sorts=[['progress','進度'],['kills','討伐'],['level','等級'],['name','名稱']];
    const all=allBossNames();
    let list=all.slice().filter(n=>{
      const k=this.s.codexBoss?.[n]||0, ready=k>=3&&!this.s.claimed?.['boss_'+n], claimed=!!this.s.claimed?.['boss_'+n];
      if(filter==='current') return (this.map().mons||[]).includes(n)||bossMaps(n).some(m=>m.id===this.s.map);
      if(filter==='unseen') return k<=0;
      if(filter==='ready') return ready;
      if(filter==='claimed') return claimed;
      return true;
    });
    list.sort((a,b)=>{
      const ka=this.s.codexBoss?.[a]||0, kb=this.s.codexBoss?.[b]||0;
      if(sort==='kills') return kb-ka;
      if(sort==='level') return ((bossData(a)?.lv)||999)-((bossData(b)?.lv)||999);
      if(sort==='name') return String(a).localeCompare(String(b),'zh-Hant');
      return Math.min(3,kb)-Math.min(3,ka);
    });
    const done=all.filter(n=>(this.s.codexBoss?.[n]||0)>=3).length;
    const ready=all.filter(n=>(this.s.codexBoss?.[n]||0)>=3&&!this.s.claimed?.['boss_'+n]).length;
    const totalKills=Object.values(this.s.codexBoss||{}).reduce((a,b)=>a+(Number(b)||0),0);
    const rows=list.map(n=>{
      const k=this.s.codexBoss?.[n]||0, pct=Math.min(100,Math.floor(k/3*100)), claimed=!!this.s.claimed?.['boss_'+n], can=k>=3&&!claimed;
      const bd=bossData(n), maps=bossMaps(n), first=maps[0];
      const drops=bossDrops(n).map(id=>`<span class="pill">${esc(itemName(id))}</span>`).join('')||'<span class="muted">無掉落資料</span>';
      const mapPills=maps.slice(0,8).map(m=>`<span class="pill ${m.id===this.s.map?'blue':''}">${esc(m.name)} Lv.${m.min}-${m.max}</span>`).join('')||'<span class="muted">無地圖資料</span>';
      return `<div class="codex-v432-card ${rankClassByProgress(pct)} boss-card">
        <div class="row"><div><b class="red">${esc(n)}</b> ${claimed?'<span class="pill green">已完成</span>':can?'<span class="pill red">可領獎</span>':k>0?'<span class="pill blue">已討伐</span>':'<span class="pill muted">未討伐</span>'}<br><span class="muted">討伐 ${num(k)}/3｜${bd?'Boss Lv.'+bd.lv+'｜HP '+num(bd.hp):'野外 / 地圖 Boss'}</span></div><div class="codex-v432-actions"><button data-act="goBossMapV432" data-arg="${esc(n)}" ${first?'':'disabled'}>前往</button><button data-act="fightBossBookV432" data-arg="${esc(n)}">討伐/指定</button><button data-act="claimBossBook" data-arg="${esc(n)}" ${can?'':'disabled'}>領取</button></div></div>
        <div class="codex-v432-progress"><span style="width:${pct}%"></span><b>${pct}%</b></div>
        <div class="codex-v432-sub"><span>討伐 ${num(k)}</span><span>關聯地圖 ${maps.length}</span><span>掉落 ${bossDrops(n).length}</span></div>
        <details><summary>地圖 / 掉落</summary><div class="drop-box"><b>關聯地圖</b>${mapPills}</div><div class="drop-box"><b>掉落</b>${drops}</div></details>
      </div>`;
    }).join('');
    return this.hero('BOSS圖鑑 V43.2','操作按鈕已統一為地圖圖鑑模式：篩選、排序、前往、討伐/指定、領取。')+
      this.statCards([['Boss種類',all.length,'red'],['可領獎',ready,'gold'],['已完成',done+'/'+all.length,'green'],['討伐紀錄',num(totalKills),'blue'],['目前地圖',esc(this.map().name),'cyan']])+
      `<div class="tabs page-tabs">${filters.map(([id,n])=>`<button class="tab ${filter===id?'on':''}" data-act="bossBookFilterV432" data-arg="${id}">${n}</button>`).join('')}</div>`+
      `<div class="tabs page-tabs">${sorts.map(([id,n])=>`<button class="tab ${sort===id?'on':''}" data-act="bossBookSortV432" data-arg="${id}">排序：${n}</button>`).join('')}</div>`+
      `<div class="page-list">${rows||'<p class="muted">沒有符合條件的 Boss</p>'}</div>`;
  };

  const oldDash=Game.viewDash;
  Game.viewDash=function(){
    const base=oldDash.call(this);
    return base+`<div class="card"><b class="gold">V43.2 圖鑑按鈕統一</b><br><span class="muted">怪物圖鑑與 BOSS 圖鑑已改成與地圖圖鑑一致的篩選、排序、前往、指定目標/討伐與領取按鈕模式。</span></div>`;
  };

  const oldAudit=Game.viewAudit;
  Game.viewAudit=function(){
    const mons=allMonsterNames().length, bosses=allBossNames().length;
    return oldAudit.call(this)+`<div class="card"><b class="gold">V43.2 圖鑑功能檢查</b><br><span class="muted">怪物圖鑑：${mons} 筆｜BOSS圖鑑：${bosses} 筆｜已統一按鈕：篩選、排序、前往、指定目標/討伐、領取。</span></div>`;
  };

  const oldRenderStatus=Game.renderStatus;
  Game.renderStatus=function(){
    oldRenderStatus.call(this); ensureCss();
    const t=document.querySelector('#app .top .title'); if(t) t.textContent='天堂M Core Rebuild V43.2｜圖鑑按鈕統一版';
    document.title='天堂M Core Rebuild V43.2｜圖鑑按鈕統一版';
  };

  window.addEventListener('DOMContentLoaded',()=>{ensureCss(); document.title='天堂M Core Rebuild V43.2｜圖鑑按鈕統一版'; const h=document.querySelector('#start h1'); if(h) h.textContent='天堂M Core Rebuild V43.2'; const t=document.querySelector('#app .top .title'); if(t) t.textContent='天堂M Core Rebuild V43.2｜圖鑑按鈕統一版';});
})();
</script>

</body></html>

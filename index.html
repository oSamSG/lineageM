    const gb=(DB.guildBossesV23||[{id:'gb_basic',name:'血盟突襲 Boss',lv:20,hp:50000},{id:'gb_dragon',name:'血盟龍王',lv:60,hp:300000}]).map(b=>{
      const can=(this.s.daily.guildBoss||0)>0;
      return `<div class="list-card boss-card"><div class="row"><div><b class="red">${$e(b.name)}</b><br><span class="muted">建議 Lv.${b.lv||1}｜HP ${$n(b.hp||0)}</span></div><button data-act="guildBossV23" data-arg="${$e(b.id)}" ${can?'':'disabled'}>召喚</button></div></div>`;
    }).join('');
    return (this.hero?this.hero('血盟副本 / 血盟Boss',`血盟副本 ${this.s.daily.guildDungeon||0}/${GUILD_DUNGEON_MAX}｜血盟Boss ${this.s.daily.guildBoss||0}/${GUILD_BOSS_MAX}`):'<h3 class="title">血盟副本 / 血盟Boss</h3>')+
      `<h4 class="title">血盟副本</h4><div class="page-list">${gd}</div><h4 class="title">血盟Boss</h4><div class="page-list">${gb}</div>`;
  };

  Game.viewTJV23=function(){
    const hist=(this.s.tj.history||[]).slice(0,20).map(x=>`<div class="list-card">${new Date(x.t).toLocaleString()}｜${$e(x.msg)}</div>`).join('');
    return (this.hero?this.hero('TJ系統',`今日 TJ 補償剩餘 ${this.s.daily.tj||0}/${TJ_MAX} 次`):'<h3 class="title">TJ系統</h3>')+
      (this.statCards?this.statCards([['TJ補償',(this.s.daily.tj||0)+'/'+TJ_MAX,'gold'],['復原券',this.s.tj.restore||0,'green'],['卡片券',this.s.tj.card||0,'purple'],['強化券',this.s.tj.enchant||0,'blue']]):'')+
      `<div class="two-col"><div class="card"><b>每日 TJ 補償</b><p class="muted">提供強化、卡片與製作支援。</p><button data-act="tj" class="gold" ${(this.s.daily.tj||0)>0?'':'disabled'}>領取 TJ 補償</button></div><div class="card"><b>使用券</b><p class="muted">可使用既有 TJ 功能。</p><button data-act="tjRestore" ${(this.s.daily.tjRestore||0)>0?'':'disabled'}>TJ復原</button> <button data-act="tjCard" ${(this.s.daily.tjCard||0)>0?'':'disabled'}>TJ卡片</button> <button data-act="tjEnchant" ${(this.s.daily.tjEnchant||0)>0?'':'disabled'}>TJ強化</button></div></div><h4 class="title">紀錄</h4><div class="page-list">${hist||'<p class="muted">尚無紀錄</p>'}</div>`;
  };

  // 移除地圖圖鑑/卡片收藏等頁面內的「完成度」字樣，改成持有與登錄狀態。
  const cleanWords=html=>String(html||'').replace(/完成度/g,'進度').replace(/完整度/g,'資料').replace(/V\d+[^<]{0,80}/g,'');
  const oldMapBook=Game.viewMapBookV23;
  if(oldMapBook) Game.viewMapBookV23=function(){return cleanWords(oldMapBook.call(this));};
  const oldCardBook=Game.viewCardBookV23;
  if(oldCardBook) Game.viewCardBookV23=function(){return cleanWords(oldCardBook.call(this));};
  const oldMonsterBook=Game.viewMonsterBookV23;
  if(oldMonsterBook) Game.viewMonsterBookV23=function(){return cleanWords(oldMonsterBook.call(this));};
  const oldBossBook=Game.viewBossBookV23;
  if(oldBossBook) Game.viewBossBookV23=function(){return cleanWords(oldBossBook.call(this));};

  const oldActionClean=Game.action;
  Game.action=function(a,arg,b){
    if(a==='mail'){
      const s=this.s; this.ensure();
      if(s.daily.mailDate===TODAY()){alert('今日已領取');return;}
      s.daily.mailDate=TODAY();
      s.adena=(s.adena||0)+500000;
      s.diamond=(s.diamond||0)+300;
      s.leaf=Math.min(999,(s.leaf||0)+300);
      this.addItem('leaf_box',5);
      this.addItem('potion_clear',100);
      this.addItem('scroll_weapon',3);
      this.addItem('scroll_armor',5);
      this.addItem('m18_powder',100);
      this.log('已領取每日補償','green');
      this.render(); this.save(false); return;
    }
    if(a==='tj'){
      const s=this.s; this.ensure();
      if((s.daily.tj||0)<=0){alert('今日 TJ 補償已領完');return;}
      s.daily.tj--;
      s.tj=s.tj||{restore:1,card:1,enchant:1,history:[]};
      s.tj.restore=(s.tj.restore||0)+1;
      s.tj.card=(s.tj.card||0)+1;
      s.tj.enchant=(s.tj.enchant||0)+1;
      s.diamond=(s.diamond||0)+500;
      this.addItem('scroll_bless_weapon',3);
      this.addItem('scroll_bless_armor',5);
      this.addItem('v23_tj_coin',3);
      this.addItem('m18_powder',300);
      s.tj.history.unshift({t:Date.now(),msg:'領取 TJ 補償'});
      this.log('已領取 TJ 補償','green');
      this.render(); this.save(false); return;
    }
    if(a==='audit'){this.tab='dash';this.renderTab();return;}
    return oldActionClean.call(this,a,arg,b);
  };

  const oldRenderTabClean=Game.renderTab;
  Game.renderTab=function(){
    if(this.tab==='audit'){this.tab='dash';}
    return oldRenderTabClean.call(this);
  };
})();

</script>


<!-- === V37 MAP BOOK DROP SEARCH FIX === -->
<script>
(function(){
  const $e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const $n=n=>Math.floor(Number(n)||0).toLocaleString();
  const uniq=a=>[...new Set((a||[]).filter(Boolean))];
  const statName={str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',dmg:'傷害',hit:'命中',dr:'減傷',mr:'MR',spd:'速度',hp:'HP',mp:'MP',ac:'AC'};
  const itemName=id=>(DB.item&&DB.item[id]&&DB.item[id].name)||id;
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,Number(v)||0));
  const statLine=o=>Object.entries(o||{}).map(([k,v])=>`${statName[k]||k}${v>=0?'+':''}${v}`).join('、')||'無';

  function mapRewardFixed(map){
    if(typeof mapReward==='function') return mapReward(map);
    const lv=Number(map.min)||1;
    if(/龍|安塔|巴拉|法利|林德|四龍/i.test((map.name||'')+' '+(map.id||''))) return {dmg:2,dr:1,hp:80};
    if(/傲慢|支配|遺忘|地獄|拉斯塔/i.test((map.name||'')+' '+(map.id||''))) return {dmg:1,dr:1,mr:5};
    if(lv>=75) return {dmg:1,dr:1};
    if(lv>=45) return {hit:1,hp:50};
    if(lv>=20) return {hp:30};
    return {hp:15};
  }
  function dropsOf(map){return uniq([...(map.drops||[]),...(map.materialDrops||[])]).filter(id=>DB.item&&DB.item[id]);}
  function bossOf(map){
    const text=((map.name||'')+' '+(map.id||'')).toLowerCase();
    const byMap=(map.mons||[]).filter(n=>/王|boss|龍|安塔|巴拉|法利|林德|吉爾|巴風|死亡騎士|巫妖|木乃伊|吸血鬼|巨蟻|不死鳥|惡魔|克特|賽尼斯/i.test(n));
    const byBoss=(DB.bosses||[]).filter(b=>{
      const zone=String(b.zone||'').toLowerCase();
      return zone.includes(String(map.id).toLowerCase()) || text.includes(String(b.name||'').toLowerCase()) || ((map.min||0)>=70 && Math.abs((b.lv||0)-(map.min||0))<=12);
    }).map(b=>b.name);
    return uniq([...byMap,...byBoss]).slice(0,10);
  }
  function monsOf(map){return uniq(map.mons||[]);}
  function searchableText(map){
    return [map.name,map.id,map.min,map.max,...monsOf(map),...bossOf(map),...dropsOf(map).map(id=>itemName(id)),...dropsOf(map)].join(' ').toLowerCase();
  }

  const oldEnsure=Game.ensure;
  Game.ensure=function(){
    oldEnsure.call(this);
    if(!this.s) return;
    this.s.codexMap=this.s.codexMap||{};
    this.s.mapDiscovered=this.s.mapDiscovered||{};
    this.s.mapClaimed=this.s.mapClaimed||{};
    this.s.codexMon=this.s.codexMon||{};
    this.s.codexBoss=this.s.codexBoss||{};
    if(this.s.map && !this.s.mapDiscovered[this.s.map]){
      this.s.mapDiscovered[this.s.map]=true;
      this.s.codexMap[this.s.map]=Math.max(1,this.s.codexMap[this.s.map]||0);
    }
  };

  Game.mapProgressV37Fixed=function(map){
    this.ensure();
    const explore=clamp(this.s.codexMap?.[map.id]||0,0,100);
    const mons=monsOf(map), bosses=bossOf(map);
    const monCount=mons.filter(n=>(this.s.codexMon?.[n]||0)>0).length;
    const bossCount=bosses.filter(n=>(this.s.codexBoss?.[n]||0)>0).length;
    const monPct=mons.length?Math.floor(monCount/mons.length*100):100;
    const bossPct=bosses.length?Math.floor(bossCount/bosses.length*100):100;
    const total=Math.floor(explore*0.5+monPct*0.35+bossPct*0.15);
    return {explore,mons,bosses,monCount,bossCount,monPct,bossPct,total};
  };
  Game.mapBookReadyV31=function(map){return this.mapProgressV37Fixed(map).total>=100;};

  const oldSpawn=Game.spawn;
  Game.spawn=function(){
    oldSpawn.call(this);
    if(this.s&&this.s.map){
      this.s.mapDiscovered=this.s.mapDiscovered||{};
      this.s.codexMap=this.s.codexMap||{};
      this.s.mapDiscovered[this.s.map]=true;
      this.s.codexMap[this.s.map]=clamp((this.s.codexMap[this.s.map]||0)+1,0,100);
      if(this.s.mon) this.s.mon.map=this.s.map;
    }
  };
  const oldKill=Game.kill;
  Game.kill=function(mon,bonus){
    const mapId=(mon&&mon.map)||this.s.map;
    if(mon&&mon.name){
      this.s.codexMon=this.s.codexMon||{};
      this.s.codexMon[mon.name]=(this.s.codexMon[mon.name]||0)+1;
      if(mon.boss){this.s.codexBoss=this.s.codexBoss||{};this.s.codexBoss[mon.name]=(this.s.codexBoss[mon.name]||0)+1;}
    }
    this.s.codexMap=this.s.codexMap||{};
    this.s.mapDiscovered=this.s.mapDiscovered||{};
    this.s.mapDiscovered[mapId]=true;
    this.s.codexMap[mapId]=clamp((this.s.codexMap[mapId]||0)+3,0,100);
    oldKill.call(this,mon,bonus);
  };

  const oldAction=Game.action;
  Game.action=function(a,arg,b){
    if(a==='mapDropSearchV37'){
      const el=document.getElementById('mapDropSearchV37');
      this.mapDropSearchV37=(el&&el.value||'').trim();
      this.renderTab();return;
    }
    if(a==='clearMapDropSearchV37'){
      this.mapDropSearchV37='';this.mapBookFilterV31='all';this.renderTab();return;
    }
    if(a==='goMap'){
      this.ensure();
      if((DB.maps||[]).some(m=>m.id===arg)){
        this.s.map=arg;this.s.mon=null;
        this.s.mapDiscovered[arg]=true;
        this.s.codexMap[arg]=clamp((this.s.codexMap[arg]||0)+5,0,100);
        this.save(false);this.render();
      }
      return;
    }
    if(a==='claimMapBookV31'){
      this.ensure();
      const map=(DB.maps||[]).find(m=>m.id===arg); if(!map) return;
      if(!this.mapBookReadyV31(map)){alert('地圖進度尚未達 100%');return;}
      if(this.s.mapClaimed[arg]){alert('此地圖獎勵已領取');return;}
      this.s.mapClaimed[arg]=true;
      this.addItem('m18_powder',80);
      if(DB.item.v23_pattern_stone) this.addItem('v23_pattern_stone',2);
      this.log('地圖圖鑑獎勵：'+map.name+'｜'+statLine(mapRewardFixed(map)),'gold');
      this.render();this.save(false);return;
    }
    if(a==='mapBookFilterV31'){this.mapBookFilterV31=arg||'all';this.renderTab();return;}
    if(a==='mapBookSortV31'){this.mapBookSortV31=arg||'progress';this.renderTab();return;}
    return oldAction.call(this,a,arg,b);
  };

  Game.viewMapBookV23=function(){
    this.ensure();
    const filter=this.mapBookFilterV31||'all', sort=this.mapBookSortV31||'progress';
    const q=String(this.mapDropSearchV37||'').trim().toLowerCase();
    const filters=[['all','全部'],['current','目前地圖'],['undiscovered','未探索'],['ready','可領獎'],['claimed','已領取']];
    const sorts=[['progress','進度'],['level','等級'],['name','名稱'],['drops','掉落數']];
    let maps=(DB.maps||[]).slice().filter(map=>{
      const p=this.mapProgressV37Fixed(map), found=!!this.s.mapDiscovered?.[map.id], ready=this.mapBookReadyV31(map), claimed=!!this.s.mapClaimed?.[map.id];
      if(q && !searchableText(map).includes(q)) return false;
      if(filter==='current') return map.id===this.s.map;
      if(filter==='undiscovered') return !found;
      if(filter==='ready') return ready&&!claimed;
      if(filter==='claimed') return claimed;
      return true;
    });
    maps.sort((a,b)=>{
      if(sort==='level') return (a.min||0)-(b.min||0);
      if(sort==='name') return String(a.name).localeCompare(String(b.name),'zh-Hant');
      if(sort==='drops') return dropsOf(b).length-dropsOf(a).length;
      return this.mapProgressV37Fixed(b).total-this.mapProgressV37Fixed(a).total;
    });
    const all=DB.maps||[];
    const discovered=all.filter(m=>this.s.mapDiscovered?.[m.id]).length;
    const ready=all.filter(m=>this.mapBookReadyV31(m)&&!this.s.mapClaimed?.[m.id]).length;
    const claimed=all.filter(m=>this.s.mapClaimed?.[m.id]).length;
    const rows=maps.map(map=>{
      const p=this.mapProgressV37Fixed(map), found=!!this.s.mapDiscovered?.[map.id], ready=this.mapBookReadyV31(map)&&!this.s.mapClaimed?.[map.id], claimed=!!this.s.mapClaimed?.[map.id];
      const drops=dropsOf(map);
      const dropHtml=drops.map(id=>`<span class="pill ${q&&itemName(id).toLowerCase().includes(q)?'gold':''}">${$e(itemName(id))}</span>`).join('')||'<span class="muted">無掉落資料</span>';
      const monHtml=p.mons.map(n=>`<span class="pill ${(this.s.codexMon?.[n]||0)>0?'green':''}">${$e(n)} ${this.s.codexMon?.[n]||0}</span>`).join('')||'<span class="muted">無怪物資料</span>';
      const bossHtml=p.bosses.map(n=>`<span class="pill ${(this.s.codexBoss?.[n]||0)>0?'red':''}">${$e(n)} ${this.s.codexBoss?.[n]||0}</span>`).join('')||'<span class="muted">無 Boss 資料</span>';
      return `<div class="map-fix-card ${claimed?'done':ready?'ready':found?'active':'locked'}">
        <div class="map-fix-head">
          <div><b class="gold">${$e(map.name)}</b> <span class="pill">Lv.${map.min}-${map.max}</span> ${claimed?'<span class="pill green">已領取</span>':ready?'<span class="pill red">可領獎</span>':found?'<span class="pill blue">已探索</span>':'<span class="pill">未探索</span>'}<br><span class="muted">永久獎勵：${statLine(mapRewardFixed(map))}</span></div>
          <div class="map-fix-actions"><button data-act="goMap" data-arg="${$e(map.id)}" ${map.id===this.s.map?'disabled':''}>前往</button><button data-act="claimMapBookV31" data-arg="${$e(map.id)}" ${ready?'':'disabled'}>領取</button></div>
        </div>
        <div class="map-fix-bar"><i style="width:${p.total}%"></i><span>${p.total}%</span></div>
        <div class="map-fix-sub"><span>探索 ${p.explore}/100</span><span>怪物 ${p.monCount}/${p.mons.length||0}</span><span>Boss ${p.bossCount}/${p.bosses.length||0}</span><span>掉落 ${drops.length}</span></div>
        <details ${q?'open':''}><summary>怪物 / Boss / 掉落</summary><div class="drop-box"><b>掉落</b>${dropHtml}</div><div class="drop-box"><b>怪物</b>${monHtml}</div><div class="drop-box"><b>Boss</b>${bossHtml}</div></details>
      </div>`;
    }).join('');
    return (this.hero?this.hero('地圖圖鑑','地圖探索、怪物登錄、Boss登錄、永久獎勵與掉落搜尋。'):'<h3 class="title">地圖圖鑑</h3>')+
      (this.statCards?this.statCards([['地圖數',all.length,'gold'],['已探索',discovered+'/'+all.length,'green'],['可領獎',ready,'red'],['已領取',claimed,'blue'],['搜尋結果',maps.length,'cyan']]):'')+
      `<div class="map-search-box"><input id="mapDropSearchV37" type="search" placeholder="搜尋地圖、怪物、Boss、掉落物，例如：祝福粉末、武卷、龍鱗" value="${$e(this.mapDropSearchV37||'')}"><button data-act="mapDropSearchV37" class="gold">搜尋掉落</button><button data-act="clearMapDropSearchV37">清除</button></div>`+
      `<div class="tabs page-tabs">${filters.map(([id,n])=>`<button class="tab ${filter===id?'on':''}" data-act="mapBookFilterV31" data-arg="${id}">${n}</button>`).join('')}</div>`+
      `<div class="tabs page-tabs">${sorts.map(([id,n])=>`<button class="tab ${sort===id?'on':''}" data-act="mapBookSortV31" data-arg="${id}">排序：${n}</button>`).join('')}</div>`+
      `<div class="page-list">${rows||'<p class="muted">沒有找到符合條件的地圖或掉落物</p>'}</div>`;
  };

  const css=document.createElement('style');
  css.textContent=`
    .map-search-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#081120;border:1px solid #26364e;border-radius:14px;padding:10px;margin:10px 0}
    .map-search-box input{flex:1;min-width:280px;height:38px}
    .map-fix-card{background:#07101d;border:1px solid #26364e;border-radius:14px;padding:12px;margin:10px 0;overflow:hidden}
    .map-fix-card.active{border-color:#3b82f6}.map-fix-card.ready{border-color:#facc15}.map-fix-card.done{border-color:#22c55e}.map-fix-card.locked{opacity:.72}
    .map-fix-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}.map-fix-actions{white-space:nowrap}.map-fix-actions button{margin-left:4px}
    .map-fix-bar{height:18px;background:#030814;border:1px solid #334155;border-radius:99px;overflow:hidden;position:relative;margin:10px 0}.map-fix-bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#22c55e);width:0}.map-fix-bar span{position:absolute;inset:0;text-align:center;line-height:16px;font-size:12px;text-shadow:1px 1px 2px #000}
    .map-fix-sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;color:#94a3b8;font-size:13px;margin-bottom:8px}.drop-box{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.drop-box b{margin-right:4px;color:#facc15}.pill.gold{border-color:#facc15;color:#facc15;background:#2b2512}
    @media(max-width:720px){.map-fix-head{grid-template-columns:1fr}.map-fix-actions button{margin-left:0;margin-right:4px}}
  `;
  document.head.appendChild(css);
})();


/* === V37 SKILL BOOK DROP / GUNNER EQUIPMENT FIX ===
   1) 全站版本升級 V37
   2) 怪物掉落技能書補全：所有職業技能書依地圖等級與技能階級加入掉落池與地圖圖鑑搜尋
   3) 修復槍手武器可用判定：步槍/手槍/槍械類型統一視為 gun，槍手可正確裝備與製作
*/
(function(){
  const esc=(typeof E==='function')?E:(s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])));
  const fmt=n=>Math.floor(Number(n)||0).toLocaleString();
  const RANK_VAL={N:1,R:2,SR:3,SSR:4,L:5,M:6};
  const BOOK_RANK_LEVEL={N:1,R:10,SR:30,SSR:50,L:70,M:85};
  const ARMOR_TYPES=['helmet','tshirt','armor','cloak','gloves','boots'];
  const ACC_TYPES=['amulet','belt','earring','ring','rune','seal','relic'];
  const EQUIP_TYPES=['weapon'].concat(ARMOR_TYPES,ACC_TYPES);
  const TYPE_NAME={weapon:'武器',helmet:'頭盔',tshirt:'內衣',armor:'盔甲',cloak:'斗篷',gloves:'手套',boots:'鞋子',amulet:'項鍊',belt:'腰帶',earring:'耳環',ring:'戒指',rune:'符石',seal:'印章',relic:'聖物',book:'技能書',material:'材料',scroll:'卷軸',potion:'藥水',box:'箱子',buff:'道具',elixir:'萬能藥'};
  const RANK_NAME={N:'一般',R:'高級',SR:'稀有',SSR:'英雄',L:'傳說',M:'神話'};
  const weaponAlias={gun:'gun',rifle:'gun',pistol:'gun',handgun:'gun',launcher:'gun',cannon:'gun',hand_cannon:'gun',magic_cannon:'gun'};
  function normWeapon(w){return weaponAlias[w]||w||'';}
  function uniq(arr){return Array.from(new Set((arr||[]).filter(Boolean)));}
  function classIds(){return Object.keys(DB.classes||{});}

  // 技能書獨立追加掉落：避免權重池太大導致技能書實際掉率過低。

/* === V37 MAP BOOK BOSS KILL HOTFIX ===
   修復：地圖圖鑑中的 Boss 名稱若不是原本 spawn() 判斷式的「王/龍/安塔/巴拉」關鍵字，
   例如「巴風特侍徒」，擊殺後不會登錄到地圖圖鑑 Boss 進度。
   1) 以地圖圖鑑 bossOf()/mapProgressV37Fixed 的 Boss 清單為準。
   2) spawn 後若目標名稱屬於該地圖 Boss 清單，強制標記為 Boss。
   3) kill 後保證 codexBoss 至少 +1，不再因 mon.boss=false 漏登錄。
*/
(function(){
  const safeE=(typeof E==='function')?E:(s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])));
  const uniq=arr=>Array.from(new Set((arr||[]).filter(Boolean)));

  document.title='天堂M Core Rebuild V37';
  const mainTitle=document.querySelector('#app .top .title');
  if(mainTitle) mainTitle.textContent='天堂M Core Rebuild V37';
  const startTitle=document.querySelector('#start h1');
  if(startTitle) startTitle.textContent='天堂M Core Rebuild V37';

  Game.versionLabel='V37';

  Game.mapBossNamesV37=function(map){
    if(!map) return [];
    const bossKeywords=/王|boss|龍|安塔|巴拉|法利|林德|吉爾|巴風|巴風特|死亡騎士|巫妖|木乃伊|吸血鬼|巨蟻|不死鳥|惡魔|克特|賽尼斯|侍徒|祭司|守護|首領|隊長/i;
    const fromMon=(map.mons||[]).filter(n=>bossKeywords.test(String(n)));
    const mapText=((map.id||'')+' '+(map.name||'')).toLowerCase();
    const fromBoss=(DB.bosses||[]).filter(b=>{
      const bn=String(b.name||'');
      const zone=String(b.zone||'').toLowerCase();
      return zone.includes(String(map.id||'').toLowerCase()) || mapText.includes(bn.toLowerCase()) || ((map.min||0)>=70 && Math.abs((b.lv||0)-(map.min||0))<=12);
    }).map(b=>b.name);
    return uniq(fromMon.concat(fromBoss));
  };

  Game.isMapBossV37=function(name,map){
    const n=String(name||'');
    if(!n) return false;
    return this.mapBossNamesV37(map||this.map()).some(b=>b===n || n.includes(b) || b.includes(n));
  };

  // 覆寫進度計算，Boss 清單改用 V37 統一清單，避免畫面與擊殺判定不同步。
  const oldProgress=Game.mapProgressV37Fixed;
  Game.mapProgressV37Fixed=function(map){
    const p=oldProgress?oldProgress.call(this,map):{explore:0,mons:[],bosses:[],monCount:0,bossCount:0,monPct:0,bossPct:100,total:0};
    const bosses=this.mapBossNamesV37(map);
    const bossCount=bosses.filter(n=>(this.s?.codexBoss?.[n]||0)>0).length;
    const bossPct=bosses.length?Math.floor(bossCount/bosses.length*100):100;
    const explore=Math.max(0,Math.min(100,p.explore||0));
    const monPct=Math.max(0,Math.min(100,p.monPct||0));
    const total=Math.floor(explore*0.5+monPct*0.35+bossPct*0.15);
    return Object.assign({},p,{bosses,bossCount,bossPct,total});
  };

  const oldSpawn=Game.spawn;
  Game.spawn=function(){
    oldSpawn.call(this);
    if(this.s&&this.s.mon){
      const map=this.map();
      this.s.mon.map=this.s.map;
      if(this.isMapBossV37(this.s.mon.name,map)){
        this.s.mon.boss=true;
        this.s.mon.max=Math.max(this.s.mon.max||1,this.s.mon.hp||1);
      }
    }
  };

  const oldKill=Game.kill;
  Game.kill=function(mon,bonus){
    const mapId=(mon&&mon.map)||this.s?.map;
    const map=(DB.maps||[]).find(m=>m.id===mapId)||this.map();
    const isBoss=!!(mon&&this.isMapBossV37(mon.name,map));
    let before=0;
    if(isBoss){
      this.s.codexBoss=this.s.codexBoss||{};
      before=this.s.codexBoss[mon.name]||0;
      mon.boss=true;
      mon.map=mapId;
    }
    oldKill.call(this,mon,bonus);
    if(isBoss){
      this.s.codexBoss=this.s.codexBoss||{};
      // 若舊邏輯沒有登錄，強制補 1 次；若舊邏輯已登錄，不重複加。
      if((this.s.codexBoss[mon.name]||0)<=before){
        this.s.codexBoss[mon.name]=before+1;
        this.log('BOSS圖鑑登錄：'+mon.name,'gold');
      }
      this.s.mapDiscovered=this.s.mapDiscovered||{};
      this.s.codexMap=this.s.codexMap||{};
      if(mapId){
        this.s.mapDiscovered[mapId]=true;
        this.s.codexMap[mapId]=Math.max(this.s.codexMap[mapId]||0,100);
      }
      this.save(false);
    }
  };

  const oldViewMapBook=Game.viewMapBookV23;
  Game.viewMapBookV23=function(){
    let html=oldViewMapBook?oldViewMapBook.call(this):'';
    html=html.replace(/地圖圖鑑/g,'地圖圖鑑');
    return html;
  };
})();


/* === V37 圖鑑與狩獵 UI 精簡版 ===

        <div class="bar"><i class="exp" style="width:${Math.max(0,Math.min(100,p.total||0))}%"></i><span>${p.total||0}%</span></div>
        <div class="map-v37-sub"><span>探索 ${p.explore||0}/100</span><span>怪物 ${p.monCount||0}/${(p.mons||[]).length}</span><span>Boss ${p.bossCount||0}/${bosses.length}</span><span>掉落 ${drops.length}</span></div>

    return (this.hero?this.hero('地圖圖鑑','地圖探索、怪物登錄、Boss登錄、永久獎勵與搜尋掉落。'):'<h3 class="title">地圖圖鑑</h3>')+
      (this.statCards?this.statCards([['地圖',all.length,'gold'],['已探索',all.filter(m=>this.s.mapDiscovered?.[m.id]).length+'/'+all.length,'green'],['可領獎',all.filter(m=>(this.mapProgressV37(m).total||0)>=100&&!this.s.mapClaimed?.[m.id]).length,'red'],['目前地圖',esc(this.map().name),'blue']]):'')+

/* === V40 地圖圖鑑怪物同步修正版 ===

(function(){
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  const itemName=id=>(DB.item&&DB.item[id]?DB.item[id].name:id);
  const statLine=o=>Object.entries(o||{}).map(([k,v])=>`${k}${v>=0?'+':''}${v}`).join('、')||'無';
  const dropsOf=map=>uniq([...(map?.drops||[]),...(map?.materialDrops||[])]).filter(id=>DB.item&&DB.item[id]);
  const bossPattern=/王|boss|BOSS|龍|安塔|巴拉|法利|林德|吉爾|巴風|巴風特|死亡騎士|巫妖|木乃伊|吸血鬼|巨蟻|不死鳥|惡魔|克特|賽尼斯|侍徒|祭司|守護|首領|隊長|君主|將軍/i;

  document.title='天堂M Core Rebuild V40';
  const setText=(sel,txt)=>{const el=document.querySelector(sel); if(el) el.textContent=txt;};
  setText('#start h1','天堂M Core Rebuild V40');
  const mainTitle=document.querySelector('#app .top .title'); if(mainTitle) mainTitle.textContent='天堂M Core Rebuild V40';
  const startDesc=document.querySelector('#start p'); if(startDesc) startDesc.textContent='單機HTML｜V40 地圖圖鑑怪物同步修正版。';
  Game.versionLabel='V40';

  Game.mapByIdV40=function(id){return (DB.maps||[]).find(m=>m.id===id)||this.map();};
  Game.mapBossNamesV40=function(map){
    map=map||this.map();
    const fromMap=uniq(map?.bosses||[]);
    const fromMons=uniq(map?.mons||[]).filter(n=>bossPattern.test(n));
    const mapId=String(map?.id||'').toLowerCase();
    const mapName=String(map?.name||'').toLowerCase();
    const fromBossDb=uniq((DB.bosses||[]).filter(b=>{
      const zone=String(b.zone||'').toLowerCase();
      const name=String(b.name||'').toLowerCase();
      return zone===mapId || zone.includes(mapId) || mapName.includes(name) || (map.min>=70 && Math.abs((b.lv||0)-(map.min||0))<=8);
    }).map(b=>b.name));
    return uniq([...fromMap,...fromMons,...fromBossDb]);
  };
  Game.mapMonsterNamesV40=function(map){
    map=map||this.map();
    const bosses=this.mapBossNamesV40(map);
    return uniq(map?.mons||[]).filter(n=>!bosses.some(b=>b===n || String(n).includes(b) || String(b).includes(n)));
  };
  Game.isBossNameV40=function(name,map){
    const n=String(name||''); if(!n) return false;
    return this.mapBossNamesV40(map||this.map()).some(b=>b===n || n.includes(b) || String(b).includes(n)) || bossPattern.test(n);
  };
  Game.allMapNamesForMonsterV40=function(name){
    return (DB.maps||[]).filter(m=>uniq(m.mons||[]).includes(name) || this.mapBossNamesV40(m).includes(name));
  };

  const oldEnsure=Game.ensure;
  Game.ensure=function(){
    oldEnsure.call(this);
    if(!this.s) return;
    this.s.version='core_rebuild_v40';
    this.s.codexMon=this.s.codexMon||{};
    this.s.codexBoss=this.s.codexBoss||{};
    this.s.codexMap=this.s.codexMap||{};
    this.s.mapDiscovered=this.s.mapDiscovered||{};
    this.s.mapClaimed=this.s.mapClaimed||{};
    this.s.mapMonsterSeen=this.s.mapMonsterSeen||{};
    this.s.mapBossSeen=this.s.mapBossSeen||{};
    if(this.s.map) this.s.mapDiscovered[this.s.map]=true;
  };

  Game.syncCurrentMapBookV40=function(mapId){
    if(!this.s) return;
    const map=this.mapByIdV40(mapId||this.s.map); if(!map) return;
    this.s.mapDiscovered=this.s.mapDiscovered||{};
    this.s.codexMap=this.s.codexMap||{};
    this.s.mapDiscovered[map.id]=true;
    this.s.codexMap[map.id]=Math.max(this.s.codexMap[map.id]||0,100);
    this.s.mapMonsterSeen=this.s.mapMonsterSeen||{};
    this.s.mapBossSeen=this.s.mapBossSeen||{};

    this.s.mapBossSeen[map.id]=this.s.mapBossSeen[map.id]||{};
  };

  Game.rebuildCodexV40=function(){

      if(this.s.map===m.id || this.s.mapDiscovered?.[m.id] || (this.s.codexMap?.[m.id]||0)>0){

      this.s.mapMonsterSeen[m.id]=this.s.mapMonsterSeen[m.id]||{};
      this.s.mapBossSeen[m.id]=this.s.mapBossSeen[m.id]||{};
      this.mapMonsterNamesV40(m).forEach(n=>{ if((this.s.codexMon[n]||0)>0) this.s.mapMonsterSeen[m.id][n]=true; });
      this.mapBossNamesV40(m).forEach(n=>{ if((this.s.codexBoss[n]||0)>0) this.s.mapBossSeen[m.id][n]=true; });
    });
    this.log('V40：圖鑑資料已重建','green');

    this.render();

  const oldMapChange=Game.bind;

    }
  };

  const oldEnter=Game.enter;
  Game.enter=function(){oldEnter.call(this); this.syncCurrentMapBookV40(this.s.map); this.rebuildCodexV40Silent&&this.rebuildCodexV40Silent();};

  Game.rebuildCodexV40Silent=function(){
    if(!this.s) return;
    (DB.maps||[]).forEach(m=>{
      this.s.mapMonsterSeen[m.id]=this.s.mapMonsterSeen[m.id]||{};

      this.mapMonsterNamesV40(m).forEach(n=>{ if((this.s.codexMon?.[n]||0)>0) this.s.mapMonsterSeen[m.id][n]=true; });
      this.mapBossNamesV40(m).forEach(n=>{ if((this.s.codexBoss?.[n]||0)>0) this.s.mapBossSeen[m.id][n]=true; });
    });
  };

  const oldSpawn=Game.spawn;
  Game.spawn=function(){
    oldSpawn.call(this);
    if(this.s&&this.s.mon){
      const map=this.map();
      this.s.mon.map=this.s.map;
      if(this.isBossNameV40(this.s.mon.name,map)) this.s.mon.boss=true;
      this.syncCurrentMapBookV40(this.s.map);
    }
  };

  const oldKill=Game.kill;

    this.s.mapMonsterSeen=this.s.mapMonsterSeen||{};
    this.s.mapBossSeen=this.s.mapBossSeen||{};

    const beforeBoss=this.s.codexBoss[name]||0;

    oldKill.call(this,mon,bonus);
    if(name){
      if((this.s.codexMon[name]||0)<=beforeMon) this.s.codexMon[name]=beforeMon+1;
      this.s.mapMonsterSeen[mapId]=this.s.mapMonsterSeen[mapId]||{};
      this.s.mapMonsterSeen[mapId][name]=true;
      if(isBoss){
        if((this.s.codexBoss[name]||0)<=beforeBoss) this.s.codexBoss[name]=beforeBoss+1;
        this.s.mapBossSeen[mapId]=this.s.mapBossSeen[mapId]||{};
        this.s.mapBossSeen[mapId][name]=true;
      }

    this.syncCurrentMapBookV40(mapId);

  };

  Game.mapProgressV40=function(map){
    this.ensure();
    const monsters=this.mapMonsterNamesV40(map);
    const bosses=this.mapBossNamesV40(map);

      const canClaim=(p.total||0)>=100&&!claimed;

/* === V40.1 地圖圖鑑領取修復 ===
   修復 V40 地圖圖鑑按下「領取」沒有反應：
   - 新增 claimMapReward 實際處理流程。
   - 同步支援舊 action：claimMapBookV31。
   - 領取後寫入 mapClaimed 與 claimed['map_xxx']，避免重複領取。
   - 重新渲染地圖圖鑑與角色能力，永久獎勵會透過既有 mapBookBonusV31 生效。
*/
(function(){
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const uniq=a=>[...new Set((a||[]).filter(Boolean).map(x=>String(x)))];
  const statName={str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',dmg:'傷害',hit:'命中',dr:'減傷',mr:'MR',spd:'速度',hp:'HP',mp:'MP',ac:'AC'};
  const statLineLocal=o=>Object.entries(o||{}).map(([k,v])=>`${statName[k]||k}${v>=0?'+':''}${v}`).join('、')||'無';
  const itemNameLocal=id=>(DB.item&&DB.item[id]?DB.item[id].name:id);
  const dropsOfLocal=map=>uniq([...(map?.drops||[]),...(map?.materialDrops||[])]).filter(id=>DB.item&&DB.item[id]);
  function rewardForMap(map){
    const lv=Number(map?.min)||1;
    const key=String((map?.name||'')+' '+(map?.id||''));
    const fixed={talking:{hp:30},gludin:{ac:-1},giran:{dmg:1},dragon:{dmg:2,hit:1},toi:{dr:1,mr:5},lastabad:{dmg:2,dr:1},antharas:{hp:120,dr:2},valakas:{dmg:3,hp:80}};
    if(fixed[map?.id]) return fixed[map.id];
    if(/龍|安塔|巴拉|法利|林德|四龍/i.test(key)) return {dmg:2,dr:1,hp:80};
    if(/傲慢|支配|遺忘|地獄|拉斯塔/i.test(key)) return {dmg:1,dr:1,mr:5};
    if(lv>=75) return {dmg:1,dr:1};
    if(lv>=45) return {hit:1,hp:50};
    if(lv>=20) return {hp:30};
    return {hp:15};
  }
  Game.mapBookCanClaimV401=function(map){
    this.ensure();
    const p=this.mapProgressV40?this.mapProgressV40(map):(this.mapProgressV37Fixed?this.mapProgressV37Fixed(map):(this.mapProgressV31?this.mapProgressV31(map):{total:0}));
    const monsters=p.monsters||p.mons||[];
    const bosses=p.bosses||[];
    const monDone=!monsters.length || Number(p.monCount||0)>=monsters.length || Number(p.monPct||0)>=100;
    const bossDone=!bosses.length || Number(p.bossCount||0)>=bosses.length || Number(p.bossPct||0)>=100;
    return (Number(p.total)||0)>=100 || ((Number(p.explore)||0)>=100 && monDone && bossDone);
  };
  Game.claimMapRewardV401=function(mapId){
    this.ensure();
    const map=(DB.maps||[]).find(m=>String(m.id)===String(mapId));
    if(!map){alert('找不到地圖資料');return;}
    this.s.mapClaimed=this.s.mapClaimed||{};
    this.s.claimed=this.s.claimed||{};
    if(this.s.mapClaimed[map.id]||this.s.claimed['map_'+map.id]){alert('此地圖獎勵已領取');return;}
    if(!this.mapBookCanClaimV401(map)){alert('地圖圖鑑尚未完成 100%');return;}
    this.s.mapClaimed[map.id]=true;
    this.s.claimed['map_'+map.id]=1;
    if(DB.item&&DB.item.m18_powder) this.addItem('m18_powder',80);
    if(DB.item&&DB.item.v23_pattern_stone) this.addItem('v23_pattern_stone',2);
    if(DB.item&&DB.item.v23_event_coin) this.addItem('v23_event_coin',5);
    this.log('已領取地圖圖鑑獎勵：'+map.name+'｜永久獎勵 '+statLineLocal(rewardForMap(map)),'gold');
    this.save(false);
    this.render();
  };

  const oldAction=Game.action;
  Game.action=function(a,arg,b){
    if(a==='claimMapReward'||a==='claimMapBookV31'){
      this.claimMapRewardV401(arg);
      return;
    }
    return oldAction.call(this,a,arg,b);
  };

  const oldViewMapBook=Game.viewMapBookV23;
  Game.viewMapBookV23=function(){
    this.ensure();
    if(this.rebuildCodexV40Silent) this.rebuildCodexV40Silent();
    this.pageState=this.pageState||{};
    const q=String(this.pageState.mapDropSearch||'').trim().toLowerCase();
    const all=DB.maps||[];
    const matched=q?all.filter(m=>dropsOfLocal(m).some(id=>String(itemNameLocal(id)).toLowerCase().includes(q)||String(id).toLowerCase().includes(q))):[];
    const cards=all.map(map=>{
      const p=this.mapProgressV40?this.mapProgressV40(map):(this.mapProgressV37Fixed?this.mapProgressV37Fixed(map):(this.mapProgressV31?this.mapProgressV31(map):{total:0,explore:0,monsters:[],bosses:[],monCount:0,bossCount:0}));
      const monsters=p.monsters||p.mons||[];
      const bosses=p.bosses||[];
      const active=this.s.map===map.id;
      const claimed=!!(this.s.mapClaimed?.[map.id]||this.s.claimed?.['map_'+map.id]);
      const canClaim=this.mapBookCanClaimV401(map)&&!claimed;
      const reward=rewardForMap(map);
      const monHtml=monsters.map(n=>`<span class="pill ${(this.s.codexMon?.[n]||0)>0||this.s.mapMonsterSeen?.[map.id]?.[n]?'green':''}">${esc(n)} ${(this.s.codexMon?.[n]||0)}</span>`).join('')||'<span class="muted">無</span>';
      const bossHtml=bosses.map(n=>`<span class="pill ${(this.s.codexBoss?.[n]||0)>0||this.s.mapBossSeen?.[map.id]?.[n]?'green':''}">${esc(n)} ${(this.s.codexBoss?.[n]||0)}</span>`).join('')||'<span class="muted">無</span>';
      const drops=dropsOfLocal(map);
      return `<div class="map-v40-card ${active?'active':''}">
        <div class="row"><div><b class="gold">${esc(map.name)}</b> <span class="pill">Lv.${map.min}-${map.max}</span> ${claimed?'<span class="pill green">已領取</span>':canClaim?'<span class="pill red">可領取</span>':''}<br><span class="muted">永久獎勵：${esc(statLineLocal(reward))}</span></div><div><button data-act="goMap" data-arg="${esc(map.id)}" ${active?'disabled':''}>${active?'狩獵中':'前往'}</button> <button data-act="claimMapReward" data-arg="${esc(map.id)}" ${canClaim?'':'disabled'}>領取</button></div></div>
        <div class="bar"><i class="exp" style="width:${Math.max(0,Math.min(100,p.total||0))}%"></i><span>${p.total||0}%</span></div>
        <div class="map-v40-sub"><span>探索 ${p.explore||0}/100</span><span>怪物 ${p.monCount||0}/${monsters.length}</span><span>Boss ${p.bossCount||0}/${bosses.length}</span><span>掉落 ${drops.length}</span></div>
        <details><summary>怪物 / Boss</summary><div class="drop-box"><b>怪物</b>${monHtml}</div><div class="drop-box"><b>Boss</b>${bossHtml}</div></details>
      </div>`;
    }).join('');
    const result=q?`<div class="card"><b class="cyan">搜尋掉落：${esc(this.pageState.mapDropSearch)}</b>${matched.length?matched.map(m=>{
      const hits=dropsOfLocal(m).filter(id=>String(itemNameLocal(id)).toLowerCase().includes(q)||String(id).toLowerCase().includes(q)).map(id=>`<span class="pill gold">${esc(itemNameLocal(id))}</span>`).join('');
      return `<div class="item"><b>${esc(m.name)}</b><br>${hits}</div>`;
    }).join(''):'<p class="muted">找不到掉落地圖</p>'}</div>`:'';
    return (this.hero?this.hero('地圖圖鑑 V40','地圖圖鑑領取已修復。完成 100% 後可正常領取永久獎勵。','<button data-act="rebuildCodexV40" class="gold">重建圖鑑資料</button>'):'<h3 class="title">地圖圖鑑 V40</h3>')+
      (this.statCards?this.statCards([['地圖',all.length,'gold'],['已探索',all.filter(m=>this.s.mapDiscovered?.[m.id]).length+'/'+all.length,'green'],['可領獎',all.filter(m=>this.mapBookCanClaimV401(m)&&!(this.s.mapClaimed?.[m.id]||this.s.claimed?.['map_'+m.id])).length,'red'],['已領取',all.filter(m=>this.s.mapClaimed?.[m.id]||this.s.claimed?.['map_'+m.id]).length,'blue']]):'')+
      `<div class="card"><div class="row"><b>搜尋掉落</b><input data-map-drop-search="1" value="${esc(this.pageState.mapDropSearch||'')}" placeholder="輸入道具 / 技能書名稱" style="min-width:280px;flex:1"></div></div>${result}<div class="page-list">${cards}</div>`;
  };
})();


/* === V40.2 DAILY REFRESH FIX ===
   修復商城、副本、世界王沒有每日刷新：
   - 每日日期變更時重置副本/世界王/血盟副本/血盟Boss/TJ/簽到/每日任務
   - 商城限購每日重置
   - 讀檔、進入遊戲、操作按鈕、頁面渲染、狩獵Tick都會自動檢查
*/
(function(){
  const DAILY_LIMITS={
    dungeon:30,
    boss:10,
    guildDungeon:10,
    guildBoss:5,
    signin:1,
    tj:1,
    tjRestore:1,
    tjCard:1,
    tjEnchant:1,
    diamondQuest:0,
    kills:0
  };
  function pad(n){return String(n).padStart(2,'0');}
  function todayKey(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function applyDailyDefaults(s,force){
    s.daily=s.daily||{};
    Object.entries(DAILY_LIMITS).forEach(([k,v])=>{
      if(force || typeof s.daily[k]!=='number') s.daily[k]=v;
    });
    if(force){
      s.shopBought={};
      s.dailyShopBought={};
      s.daily.diamondQuest=0;
      s.daily.kills=0;
      s.daily.mail=1;
      s.daily.tj=1;
      s.daily.tjRestore=1;
      s.daily.tjCard=1;
      s.daily.tjEnchant=1;
      s.daily.signin=1;
    }
  }
  Game.dailyLimitV402=DAILY_LIMITS;
  Game.todayKeyV402=todayKey;
  Game.checkDailyRefreshV402=function(silent){
    if(!this.s) return false;
    const s=this.s;
    const today=todayKey();
    s.daily=s.daily||{};
    s.system=s.system||{};
    if(!s.dailyDate){
      s.dailyDate=today;
      applyDailyDefaults(s,false);
      return false;
    }
    if(s.dailyDate!==today){
      const old=s.dailyDate;
      s.dailyDate=today;
      s.system.lastDailyRefresh={from:old,to:today,t:Date.now()};
      applyDailyDefaults(s,true);
      if(!silent && this.log) this.log('每日刷新完成：商城、副本、世界王、TJ、簽到次數已重置','green');
      if(this.save) this.save(false);
      return true;
    }
    applyDailyDefaults(s,false);
    return false;
  };

  const oldBase=Game.base;
  Game.base=function(cls){
    const s=oldBase.call(this,cls);
    s.dailyDate=todayKey();
    applyDailyDefaults(s,true);
    return s;
  };

  const oldEnsure=Game.ensure;
  Game.ensure=function(){
    oldEnsure.call(this);
    if(this.s) this.checkDailyRefreshV402(true);
  };

  const oldEnter=Game.enter;
  Game.enter=function(){
    const r=oldEnter.call(this);
    this.checkDailyRefreshV402(false);
    return r;
  };

  const oldTick=Game.tick;
  Game.tick=function(){
    this.checkDailyRefreshV402(true);
    return oldTick.call(this);
  };

  const oldAction=Game.action;
  Game.action=function(a,arg,b){
    this.checkDailyRefreshV402(false);
    if(a==='refreshDailyNow'){
      applyDailyDefaults(this.s,true);
      this.s.dailyDate=todayKey();
      this.log('已手動刷新每日次數','green');
      this.save(false);
      this.render();
      return;
    }
    return oldAction.call(this,a,arg,b);
  };

  const oldRender=Game.render;
  Game.render=function(){
    this.checkDailyRefreshV402(true);
    return oldRender.call(this);
  };

  const oldRenderTab=Game.renderTab;
  Game.renderTab=function(){
    this.checkDailyRefreshV402(true);
    return oldRenderTab.call(this);
  };

  const oldViewDungeon=Game.viewDungeon;
  Game.viewDungeon=function(){
    this.checkDailyRefreshV402(true);
    const html=oldViewDungeon.call(this);
    return html.replace('今日剩餘 '+this.s.daily.dungeon+' 次。','今日剩餘 '+this.s.daily.dungeon+' 次。｜每日刷新：'+this.s.dailyDate)
      +`<div class="card"><b class="green">每日刷新狀態</b><br><span class="muted">副本每日上限 ${DAILY_LIMITS.dungeon} 次，日期變更後自動刷新。</span><br><button data-act="refreshDailyNow" class="gold">手動刷新每日次數</button></div>`;
  };

  const oldViewBoss=Game.viewBoss;
  Game.viewBoss=function(){
    this.checkDailyRefreshV402(true);
    const html=oldViewBoss.call(this);
    return html.replace('今日剩餘 '+this.s.daily.boss+' 次。','今日剩餘 '+this.s.daily.boss+' 次。｜每日刷新：'+this.s.dailyDate)
      +`<div class="card"><b class="green">每日刷新狀態</b><br><span class="muted">世界王每日上限 ${DAILY_LIMITS.boss} 次，日期變更後自動刷新。</span><br><button data-act="refreshDailyNow" class="gold">手動刷新每日次數</button></div>`;
  };

  if(Game.viewShopV23 || Game.viewShop){
    const oldShop=Game.viewShopV23 || Game.viewShop;
    const shopName=Game.viewShopV23?'viewShopV23':'viewShop';
    Game[shopName]=function(){
      this.checkDailyRefreshV402(true);
      const html=oldShop.call(this);
      return html+`<div class="card"><b class="green">商城每日刷新</b><br><span class="muted">每日限購紀錄會在日期變更後自動清空。刷新日期：${this.s.dailyDate}</span><br><button data-act="refreshDailyNow" class="gold">手動刷新每日次數</button></div>`;
    };
  }

  const oldDash=Game.viewDash;
  Game.viewDash=function(){
    this.checkDailyRefreshV402(true);
    return oldDash.call(this)+`<div class="card"><b class="green">每日刷新核心</b><p class="muted">刷新日期：${this.s.dailyDate}｜副本 ${this.s.daily.dungeon}/${DAILY_LIMITS.dungeon}｜世界王 ${this.s.daily.boss}/${DAILY_LIMITS.boss}｜商城限購會每日重置。</p></div>`;
  };
})();

</script>



<!-- === V40 GUILD RAID FIX === -->
<script>
(function(){
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const fmt=n=>Math.floor(Number(n)||0).toLocaleString();
  const GUILD_DUNGEON_MAX=10, GUILD_BOSS_MAX=5;
  function count(inv,id){return Object.values(inv||{}).filter(x=>x&&x.id===id).reduce((a,x)=>a+(Number(x.qty)||0),0);}
  function consume(game,id,qty){
    let need=Number(qty)||0;
    for(const k of Object.keys(game.s.inv||{})){
      const it=game.inv(k);
      if(!it||it.id!==id) continue;
      const q=Math.min(need,Number(it.qty)||0);
      game.rem(k,q);
      need-=q;
      if(need<=0) return true;
    }
    return need<=0;
  }
  function hasCost(game,cost){return Object.entries(cost||{}).every(([id,q])=>count(game.s.inv,id)>=Number(q||0));}
  function costText(cost){
    const arr=Object.entries(cost||{});
    if(!arr.length) return '無';
    return arr.map(([id,q])=>`${esc(DB.item?.[id]?.name||id)}×${q}`).join('、');
  }
  function missingText(game,cost){
    return Object.entries(cost||{}).filter(([id,q])=>count(game.s.inv,id)<Number(q||0)).map(([id,q])=>`${esc(DB.item?.[id]?.name||id)} ${count(game.s.inv,id)}/${q}`).join('、');
  }
  function giveReward(game,reward){
    for(const [id,val] of Object.entries(reward||{})){
      const qty=Array.isArray(val)?game.rand(Number(val[0])||0,Number(val[1])||0):Number(val)||0;
      if(qty<=0) continue;
      if(id==='adena') game.s.adena=(game.s.adena||0)+qty;
      else if(id==='diamond') game.s.diamond=(game.s.diamond||0)+qty;
      else game.addItem(id,qty);
    }
  }
  function normalizeGuildRaidDB(){
    DB.guildDungeonsV23=Array.isArray(DB.guildDungeonsV23)&&DB.guildDungeonsV23.length?DB.guildDungeonsV23:[
      {id:'gd1',name:'血盟訓練場',lv:1,cost:{v23_guild_key:1},reward:{adena:[50000,150000],v23_event_coin:[5,12]}},
      {id:'gd2',name:'血盟地下基地',lv:30,cost:{v23_guild_key:2},reward:{m18_powder:[20,60],v23_skill_page:[3,8]}},
      {id:'gd3',name:'血盟龍之試煉',lv:50,cost:{v23_guild_key:3},reward:{v23_boss_token:[1,2],v23_awake_stone:[1,2]}}
    ];
    DB.guildBossV23=Array.isArray(DB.guildBossV23)&&DB.guildBossV23.length?DB.guildBossV23:[
      {id:'gb1',name:'血盟巴風特',lv:20,hp:50000,cost:{v23_boss_token:1},reward:{m18_powder:[30,80],v23_event_coin:[10,20]}},
      {id:'gb2',name:'血盟死亡騎士',lv:40,hp:120000,cost:{v23_boss_token:2},reward:{v23_awake_stone:[1,2],m18_powder:[80,180]}},
      {id:'gb3',name:'血盟安塔瑞斯幻影',lv:60,hp:300000,cost:{v23_boss_token:3},reward:{v23_relic_awake:[1,1],v23_tj_coin:[1,3]}}
    ];
  }

  const oldEnsure=Game.ensure;
  Game.ensure=function(){
    oldEnsure.call(this);
    if(!this.s) return;
    normalizeGuildRaidDB();
    this.s.version='core_rebuild_v40_guild_raid_fix';
    this.s.daily=this.s.daily||{};
    if(this.s.daily.guildDungeon===undefined) this.s.daily.guildDungeon=GUILD_DUNGEON_MAX;
    if(this.s.daily.guildBoss===undefined) this.s.daily.guildBoss=GUILD_BOSS_MAX;
    this.s.daily.guildDungeon=Math.max(0,Number(this.s.daily.guildDungeon)||0);
    this.s.daily.guildBoss=Math.max(0,Number(this.s.daily.guildBoss)||0);
    this.s.codexBoss=this.s.codexBoss||{};
    this.s.guild=this.s.guild||{name:'亞丁遠征軍',lv:1,donate:0,skill:0};
    if(!this.s.guild.name) this.s.guild.name='亞丁遠征軍';
    if(count(this.s.inv,'v23_guild_key')<=0) this.addItem('v23_guild_key',GUILD_DUNGEON_MAX);
    if(count(this.s.inv,'v23_boss_token')<=0) this.addItem('v23_boss_token',GUILD_BOSS_MAX);
  };

  Game.viewGuildRaidV23=function(){
    this.ensure();
    normalizeGuildRaidDB();
    const gd=DB.guildDungeonsV23.map(d=>{
      const lvOk=this.s.lv>=(Number(d.lv)||1);
      const costOk=hasCost(this,d.cost||{});
      const dailyOk=(this.s.daily.guildDungeon||0)>0;
      const can=lvOk&&costOk&&dailyOk;
      const miss=missingText(this,d.cost||{});
      return `<div class="list-card"><div class="row"><div><b>${esc(d.name)}</b><br><span class="muted">需求 Lv.${d.lv||1}｜消耗：${costText(d.cost||{})}</span><br><span class="${can?'green':'red'} mini">${can?'可進入':(!dailyOk?'今日次數不足':!lvOk?'等級不足':'缺少：'+miss)}</span></div><button data-act="guildDungeonV23" data-arg="${esc(d.id)}" ${can?'':'disabled'}>進入</button></div></div>`;
    }).join('');
    const gb=DB.guildBossV23.map(b=>{
      const lvOk=this.s.lv>=(Number(b.lv)||1);
      const costOk=hasCost(this,b.cost||{});
      const dailyOk=(this.s.daily.guildBoss||0)>0;
      const can=lvOk&&costOk&&dailyOk;
      const miss=missingText(this,b.cost||{});
      return `<div class="list-card boss-card"><div class="row"><div><b class="red">${esc(b.name)}</b><br><span class="muted">需求 Lv.${b.lv||1}｜HP ${fmt(b.hp||0)}｜消耗：${costText(b.cost||{})}</span><br><span class="${can?'green':'red'} mini">${can?'可召喚':(!dailyOk?'今日次數不足':!lvOk?'等級不足':'缺少：'+miss)}</span></div><button data-act="guildBossV23" data-arg="${esc(b.id)}" ${can?'':'disabled'}>召喚討伐</button></div></div>`;
    }).join('');
    return (this.hero?this.hero('血盟副本 / 血盟Boss',`血盟副本 ${this.s.daily.guildDungeon||0}/${GUILD_DUNGEON_MAX}｜血盟Boss ${this.s.daily.guildBoss||0}/${GUILD_BOSS_MAX}`):'<h3 class="title">血盟副本 / 血盟Boss</h3>')+
      (this.statCards?this.statCards([
        ['血盟副本',(this.s.daily.guildDungeon||0)+'/'+GUILD_DUNGEON_MAX,'green'],
        ['血盟Boss',(this.s.daily.guildBoss||0)+'/'+GUILD_BOSS_MAX,'red'],
        ['副本鑰匙',count(this.s.inv,'v23_guild_key'),'gold'],
        ['召喚石',count(this.s.inv,'v23_boss_token'),'purple']
      ]):'')+
      `<h4 class="title">血盟副本</h4><div class="page-list">${gd}</div><h4 class="title">血盟Boss</h4><div class="page-list">${gb}</div>`;
  };

  const oldAction=Game.action;
  Game.action=function(a,arg,b){
    this.ensure();
    normalizeGuildRaidDB();
    if(a==='guildDungeonV23'||a==='guildDungeon'){
      const d=DB.guildDungeonsV23.find(x=>x.id===arg);
      if(!d) return alert('找不到血盟副本');
      if((this.s.daily.guildDungeon||0)<=0) return alert('今日血盟副本次數不足');
      if(this.s.lv<(Number(d.lv)||1)) return alert('等級不足，需要 Lv.'+(d.lv||1));
      if(!hasCost(this,d.cost||{})) return alert('缺少：'+missingText(this,d.cost||{}));
      Object.entries(d.cost||{}).forEach(([id,q])=>consume(this,id,q));
      this.s.daily.guildDungeon--;
      giveReward(this,d.reward||{});
      this.log('完成血盟副本：'+d.name,'green');
      this.render(); this.save(false); return;
    }
    if(a==='guildBossV23'||a==='guildBoss'){
      const gb=DB.guildBossV23.find(x=>x.id===arg);
      if(!gb) return alert('找不到血盟Boss');
      if((this.s.daily.guildBoss||0)<=0) return alert('今日血盟Boss次數不足');
      if(this.s.lv<(Number(gb.lv)||1)) return alert('等級不足，需要 Lv.'+(gb.lv||1));
      if(!hasCost(this,gb.cost||{})) return alert('缺少：'+missingText(this,gb.cost||{}));
      Object.entries(gb.cost||{}).forEach(([id,q])=>consume(this,id,q));
      this.s.daily.guildBoss--;
      giveReward(this,gb.reward||{});
      this.s.codexBoss[gb.name]=(this.s.codexBoss[gb.name]||0)+1;
      if(typeof this.rebuildMapBookV40==='function') this.rebuildMapBookV40();
      this.log('血盟Boss討伐完成：'+gb.name,'green');
      this.render(); this.save(false); return;
    }
    return oldAction.call(this,a,arg,b);
  };

  const oldRefresh=Game.forceDailyRefreshV40;
  if(oldRefresh){
    Game.forceDailyRefreshV40=function(){
      oldRefresh.call(this);
      this.s.daily.guildDungeon=GUILD_DUNGEON_MAX;
      this.s.daily.guildBoss=GUILD_BOSS_MAX;
      this.addItem('v23_guild_key',GUILD_DUNGEON_MAX);
      this.addItem('v23_boss_token',GUILD_BOSS_MAX);
      this.log('已刷新血盟副本與血盟Boss次數','green');
      this.render(); this.save(false);
    };
  }

  document.title='天堂M Core Rebuild V40｜血盟副本修正版';
  const title=document.querySelector('#app .top .title'); if(title) title.textContent='天堂M Core Rebuild V40';
})();
</script>



<!-- === V41 地圖圖鑑怪物顯示與規則整理修正版 ===
  1) 地圖圖鑑的「怪物」永遠以 DB.maps[].mons 為來源完整顯示，不再因 Boss 判斷被濾掉。
  2) Boss 改為獨立規則：map.bosses、DB.bosses.zone、以及明確 Boss 關鍵字。
  3) 擊殺後同步寫入 mapMonsterSeen / mapBossSeen，舊存檔可用重建按鈕修復。
  4) 地圖圖鑑畫面改成：規則、地圖資訊、怪物、Boss、掉落搜尋分區顯示。
-->
<script>
(function(){
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const uniq=a=>[...new Set((a||[]).filter(v=>v!==undefined&&v!==null&&String(v).trim()!=='').map(v=>String(v).trim()))];
  const itemName=id=>(DB.item&&DB.item[id]?DB.item[id].name:id);
  const dropsOf=map=>uniq([...(map?.drops||[]),...(map?.materialDrops||[]),...(map?.skillBookDrops||[])]).filter(id=>DB.item&&DB.item[id]);
  const statName={str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',dmg:'傷害',hit:'命中',dr:'減傷',mr:'MR',spd:'速度',hp:'HP',mp:'MP',ac:'AC'};
  const statLine=o=>Object.entries(o||{}).map(([k,v])=>`${statName[k]||k}${Number(v)>=0?'+':''}${v}`).join('、')||'無';

  // 嚴格 Boss 規則：避免「飛龍、骨龍、龍人戰士」被誤判為 Boss 後從怪物清單消失。
  const STRICT_BOSS_RE=/^(安塔瑞斯|巴拉卡斯|法利昂|林德拜爾|吉爾塔斯|巴風特|死亡騎士|巫妖|木乃伊王|吸血鬼|巨蟻女皇|不死鳥|惡魔|克特|賽尼斯|飛龍王|巨大飛龍|巨大骷髏|巨大守護螞蟻|騎士范德|黑暗大法師|烏格奴斯|鐮刀死神|地獄君主|遺忘之王|拉斯塔巴德君王|城主幻影|監獄長|船長|奧曼大將|修練首領)$/i;
  const BOSS_WORD_RE=/世界王|血盟Boss|BOSS|Boss|首領|君主|女皇|大法師|死神|監獄長|城主|船長|大將|飛龍王|守護螞蟻/i;

  function rewardForMap(map){
    const lv=Number(map?.min)||1;
    const key=String((map?.name||'')+' '+(map?.id||''));
    const fixed={talking:{hp:30},gludin:{ac:-1},giran:{dmg:1},dragon:{dmg:2,hit:1},toi:{dr:1,mr:5},lastabad:{dmg:2,dr:1},antharas:{hp:120,dr:2},valakas:{dmg:3,hp:80}};
    if(fixed[map?.id]) return fixed[map.id];
    if(/安塔|巴拉|法利|林德|四龍/i.test(key)) return {dmg:2,dr:1,hp:80};
    if(/傲慢|支配|遺忘|地獄|拉斯塔/i.test(key)) return {dmg:1,dr:1,mr:5};
    if(lv>=75) return {dmg:1,dr:1};
    if(lv>=45) return {hit:1,hp:50};
    if(lv>=20) return {hp:30};
    return {hp:15};
  }

  Game.versionLabel='V41';
  document.title='天堂M Core Rebuild V41｜地圖圖鑑規則修正版';
  const title=document.querySelector('#app .top .title'); if(title) title.textContent='天堂M Core Rebuild V41';
  const startTitle=document.querySelector('#start h1'); if(startTitle) startTitle.textContent='天堂M Core Rebuild V41';
  const startDesc=document.querySelector('#start p'); if(startDesc) startDesc.textContent='單機HTML｜V41 地圖圖鑑規則修正版。';

  Game.mapByIdV41=function(id){return (DB.maps||[]).find(m=>String(m.id)===String(id))||this.map();};
  Game.mapMonsterNamesV41=function(map){
    map=map||this.map();
    // 重要：地圖怪物一律完整顯示 DB.maps[].mons，不再用 Boss 規則過濾。
    return uniq(map?.mons||[]);
  };
  Game.mapBossNamesV41=function(map){
    map=map||this.map();
    const mapId=String(map?.id||'').toLowerCase();
    const mapName=String(map?.name||'').toLowerCase();
    const fromMapBosses=uniq(map?.bosses||[]);
    const fromExplicitMons=uniq(map?.mons||[]).filter(n=>STRICT_BOSS_RE.test(n)||BOSS_WORD_RE.test(n));
    const fromBossDb=uniq((DB.bosses||[]).filter(b=>{
      const zone=String(b.zone||'').toLowerCase();
      const id=String(b.mapId||b.map||'').toLowerCase();
      const name=String(b.name||'').toLowerCase();
      return (zone&&zone===mapId) || (id&&id===mapId) || (zone&&zone.includes(mapId)) || mapName.includes(name);
    }).map(b=>b.name));
    return uniq([...fromMapBosses,...fromExplicitMons,...fromBossDb]);
  };
  Game.isBossNameV41=function(name,map){
    const n=String(name||'').trim(); if(!n) return false;
    return this.mapBossNamesV41(map||this.map()).includes(n) || STRICT_BOSS_RE.test(n) || BOSS_WORD_RE.test(n);
  };

  const oldEnsure=Game.ensure;
  Game.ensure=function(){
    oldEnsure.call(this);
    if(!this.s) return;
    this.s.version='core_rebuild_v41_mapbook_rules_fix';
    this.s.codexMon=this.s.codexMon||{};
    this.s.codexBoss=this.s.codexBoss||{};
    this.s.codexMap=this.s.codexMap||{};
    this.s.mapDiscovered=this.s.mapDiscovered||{};
    this.s.mapClaimed=this.s.mapClaimed||{};
    this.s.claimed=this.s.claimed||{};
    this.s.mapMonsterSeen=this.s.mapMonsterSeen||{};
    this.s.mapBossSeen=this.s.mapBossSeen||{};
    (DB.maps||[]).forEach(m=>{
      this.s.mapMonsterSeen[m.id]=this.s.mapMonsterSeen[m.id]||{};
      this.s.mapBossSeen[m.id]=this.s.mapBossSeen[m.id]||{};
    });
    if(this.s.map){
      this.s.mapDiscovered[this.s.map]=true;
      this.s.codexMap[this.s.map]=Math.max(this.s.codexMap[this.s.map]||0,1);
    }
  };

  Game.rebuildCodexV41=function(showLog=true){
    this.ensure();
    (DB.maps||[]).forEach(m=>{
      this.s.mapMonsterSeen[m.id]=this.s.mapMonsterSeen[m.id]||{};
      this.s.mapBossSeen[m.id]=this.s.mapBossSeen[m.id]||{};
      // 只根據已有擊殺數標綠，不把未擊殺怪物假登錄；但清單一定會顯示。
      this.mapMonsterNamesV41(m).forEach(n=>{ if((this.s.codexMon[n]||0)>0) this.s.mapMonsterSeen[m.id][n]=true; });
      this.mapBossNamesV41(m).forEach(n=>{ if((this.s.codexBoss[n]||0)>0) this.s.mapBossSeen[m.id][n]=true; });
      if((this.s.codexMap[m.id]||0)>0 || this.s.mapDiscovered[m.id]) this.s.mapDiscovered[m.id]=true;
    });
    if(showLog) this.log('V41：地圖圖鑑怪物與 Boss 規則已重建','green');
    this.save(false);
    if(showLog) this.render();
  };

  const oldEnter=Game.enter;
  Game.enter=function(){oldEnter.call(this); this.rebuildCodexV41(false);};

  const oldSpawn=Game.spawn;
  Game.spawn=function(){
    oldSpawn.call(this);
    if(!this.s||!this.s.mon) return;
    const map=this.map();
    this.s.mon.map=this.s.map;
    this.s.mapDiscovered[this.s.map]=true;
    this.s.codexMap[this.s.map]=Math.max(this.s.codexMap[this.s.map]||0,5);
    if(this.isBossNameV41(this.s.mon.name,map)) this.s.mon.boss=true;
  };

  const oldKill=Game.kill;
  Game.kill=function(mon,bonus){
    const mapId=String((mon&&mon.map)||this.s?.map||'');
    const map=this.mapByIdV41(mapId);
    const name=String(mon?.name||'').trim();
    const boss=this.isBossNameV41(name,map) || !!mon?.boss;
    this.ensure();
    const beforeMon=this.s.codexMon[name]||0;
    const beforeBoss=this.s.codexBoss[name]||0;
    if(mon){mon.map=mapId; if(boss) mon.boss=true;}
    oldKill.call(this,mon,bonus);
    if(name){
      if((this.s.codexMon[name]||0)<=beforeMon) this.s.codexMon[name]=beforeMon+1;
      this.s.mapMonsterSeen[mapId]=this.s.mapMonsterSeen[mapId]||{};
      this.s.mapMonsterSeen[mapId][name]=true;
      if(boss){
        if((this.s.codexBoss[name]||0)<=beforeBoss) this.s.codexBoss[name]=beforeBoss+1;
        this.s.mapBossSeen[mapId]=this.s.mapBossSeen[mapId]||{};
        this.s.mapBossSeen[mapId][name]=true;
      }
    }
    this.s.mapDiscovered[mapId]=true;
    this.s.codexMap[mapId]=Math.max(this.s.codexMap[mapId]||0,Math.min(100,(this.s.codexMap[mapId]||0)+4));
    this.save(false);
  };

  Game.mapProgressV41=function(map){
    this.ensure();
    const monsters=this.mapMonsterNamesV41(map);
    const bosses=this.mapBossNamesV41(map);
    const explore=Math.max(0,Math.min(100,Number(this.s.codexMap?.[map.id]||0)));
    const monCount=monsters.filter(n=>(this.s.codexMon?.[n]||0)>0 || !!this.s.mapMonsterSeen?.[map.id]?.[n]).length;
    const bossCount=bosses.filter(n=>(this.s.codexBoss?.[n]||0)>0 || !!this.s.mapBossSeen?.[map.id]?.[n]).length;
    const monPct=monsters.length?Math.floor(monCount/monsters.length*100):100;
    const bossPct=bosses.length?Math.floor(bossCount/bosses.length*100):100;
    const total=Math.floor(explore*.5+monPct*.35+bossPct*.15);
    return {explore,monsters,bosses,monCount,bossCount,monPct,bossPct,total};
  };
  Game.mapProgressV40=function(map){return this.mapProgressV41(map);};

  Game.mapBookCanClaimV41=function(map){
    const p=this.mapProgressV41(map);
    return p.total>=100 || (p.explore>=100 && p.monCount>=p.monsters.length && p.bossCount>=p.bosses.length);
  };

  const oldRenderStatus=Game.renderStatus;
  Game.renderStatus=function(){
    oldRenderStatus.call(this);
    const t=document.querySelector('#app .top .title'); if(t) t.textContent='天堂M Core Rebuild V41';
    const m=this.map?this.map():null, mi=this.$&&this.$('mapInfo');
    if(mi&&m){
      const p=this.mapProgressV41(m);
      mi.innerHTML=`<div><b>${esc(m.name)}</b> Lv.${m.min}-${m.max}</div><div>怪物 ${p.monsters.length}｜Boss ${p.bosses.length}｜已登錄 ${p.monCount+p.bossCount}/${p.monsters.length+p.bosses.length}</div>`;
    }
  };

  const oldAction=Game.action;
  Game.action=function(a,arg,b){
    if(a==='rebuildCodexV41'||a==='rebuildCodexV40'){this.rebuildCodexV41(true);return;}
    if(a==='mapRuleFilterV41'){this.pageState=this.pageState||{};this.pageState.mapRuleFilter=arg||'all';this.renderTab();return;}
    if(a==='claimMapReward'||a==='claimMapBookV31'){
      this.ensure();
      const map=(DB.maps||[]).find(m=>String(m.id)===String(arg));
      if(!map) return alert('找不到地圖資料');
      if(this.s.mapClaimed[map.id]||this.s.claimed['map_'+map.id]) return alert('此地圖獎勵已領取');
      if(!this.mapBookCanClaimV41(map)) return alert('地圖圖鑑尚未完成');
      this.s.mapClaimed[map.id]=true; this.s.claimed['map_'+map.id]=1;
      if(DB.item&&DB.item.m18_powder) this.addItem('m18_powder',80);
      if(DB.item&&DB.item.v23_pattern_stone) this.addItem('v23_pattern_stone',2);
      if(DB.item&&DB.item.v23_event_coin) this.addItem('v23_event_coin',5);
      this.log('已領取地圖圖鑑獎勵：'+map.name+'｜'+statLine(rewardForMap(map)),'gold');
      this.save(false); this.render(); return;
    }
    return oldAction.call(this,a,arg,b);
  };

  Game.viewMapBookV23=function(){
    this.ensure();
    this.rebuildCodexV41(false);
    this.pageState=this.pageState||{};
    const q=String(this.pageState.mapDropSearch||'').trim().toLowerCase();
    const filter=this.pageState.mapRuleFilter||'all';
    let maps=(DB.maps||[]).slice();
    if(q){
      maps=maps.filter(m=>[
        m.name,m.id,...this.mapMonsterNamesV41(m),...this.mapBossNamesV41(m),...dropsOf(m).map(id=>itemName(id)),...dropsOf(m)
      ].join(' ').toLowerCase().includes(q));
    }
    if(filter==='current') maps=maps.filter(m=>m.id===this.s.map);
    if(filter==='ready') maps=maps.filter(m=>this.mapBookCanClaimV41(m)&&!(this.s.mapClaimed?.[m.id]||this.s.claimed?.['map_'+m.id]));
    if(filter==='claimed') maps=maps.filter(m=>this.s.mapClaimed?.[m.id]||this.s.claimed?.['map_'+m.id]);
    if(filter==='undiscovered') maps=maps.filter(m=>!this.s.mapDiscovered?.[m.id]);
    maps.sort((a,b)=>this.mapProgressV41(b).total-this.mapProgressV41(a).total || (a.min||0)-(b.min||0));
    const all=DB.maps||[];
    const readyCnt=all.filter(m=>this.mapBookCanClaimV41(m)&&!(this.s.mapClaimed?.[m.id]||this.s.claimed?.['map_'+m.id])).length;
    const claimedCnt=all.filter(m=>this.s.mapClaimed?.[m.id]||this.s.claimed?.['map_'+m.id]).length;
    const rows=maps.map(map=>{
      const p=this.mapProgressV41(map), active=this.s.map===map.id;

        return `<span class="pill ${seen?'red':''}">${esc(n)} ${k}</span>`;

      const dropHtml=dropsOf(map).map(id=>`<span class="pill ${q&&(String(itemName(id)).toLowerCase().includes(q)||String(id).toLowerCase().includes(q))?'gold':''}">${esc(itemName(id))}</span>`).join('')||'<span class="muted">無掉落資料</span>';
      return `<div class="map-v41-card ${active?'active':''} ${canClaim?'ready':''} ${claimed?'done':''}">

        <div class="map-v41-sub"><span>探索 ${p.explore}/100</span><span>怪物 ${p.monCount}/${p.monsters.length}</span><span>Boss ${p.bossCount}/${p.bosses.length}</span><span>掉落 ${dropsOf(map).length}</span></div>
        <details open><summary>地圖怪物</summary><div class="drop-box"><b>怪物</b>${monHtml}</div></details>
        <details><summary>Boss</summary><div class="drop-box"><b>Boss</b>${bossHtml}</div></details>
        <details ${q?'open':''}><summary>掉落</summary><div class="drop-box"><b>掉落</b>${dropHtml}</div></details>

    return (this.hero?this.hero('地圖圖鑑 V41','地圖怪物固定由地圖資料表顯示；Boss 與掉落改為獨立規則。','<button data-act="rebuildCodexV41" class="gold">重建圖鑑資料</button>'):'<h3 class="title">地圖圖鑑 V41</h3>')+
      (this.statCards?this.statCards([['地圖',all.length,'gold'],['已探索',all.filter(m=>this.s.mapDiscovered?.[m.id]).length+'/'+all.length,'green'],['可領取',readyCnt,'red'],['已領取',claimedCnt,'blue'],['顯示結果',maps.length,'cyan']]):'')+
      `<div class="card"><b class="gold">整理規則</b><div class="map-v41-rules"><span>怪物：DB.maps[].mons 全部顯示</span><span>Boss：map.bosses / DB.bosses / 明確 Boss 名稱</span><span>掉落：drops + materialDrops + skillBookDrops</span><span>登錄：擊殺後寫入怪物與 Boss 紀錄</span></div></div>`+
      `<div class="card"><div class="row"><b>搜尋掉落 / 怪物 / Boss</b><input data-map-drop-search="1" value="${esc(this.pageState.mapDropSearch||'')}" placeholder="輸入道具、技能書、怪物、Boss、地圖名稱" style="min-width:280px;flex:1"></div></div>`+
      `<div class="tabs page-tabs">${filters.map(([id,n])=>`<button class="tab ${filter===id?'on':''}" data-act="mapRuleFilterV41" data-arg="${id}">${n}</button>`).join('')}</div>`+
      `<div class="page-list">${rows||'<p class="muted">沒有符合條件的地圖</p>'}</div>`;
  };

  const css=document.createElement('style');
  css.textContent=`.map-v41-card{background:#081120;border:1px solid #26364e;border-radius:14px;padding:12px;margin-bottom:10px}.map-v41-card.active{border-color:#facc15;background:#151807}.map-v41-card.ready{border-color:#ef4444}.map-v41-card.done{border-color:#22c55e}.map-v41-sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;color:#94a3b8;font-size:13px;margin:8px 0}.map-v41-card summary{cursor:pointer;color:#e5eef9;margin-top:8px}.map-v41-card .drop-box{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.map-v41-card .drop-box b{color:#facc15;margin-right:4px}.map-v41-rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}.map-v41-rules span{background:#07101d;border:1px solid #26364e;border-radius:10px;padding:8px;color:#cbd5e1}.pill.red{border-color:#ef4444;color:#fca5a5;background:#2a0f12}.pill.blue{border-color:#60a5fa;color:#93c5fd;background:#0b1628}.pill.gold{border-color:#facc15;color:#facc15;background:#2b2512}`;
  document.head.appendChild(css);

<!-- === V42 地圖圖鑑怪物 / Boss 分類修正版 ===
  修復：Boss 同時出現在「地圖怪物」與「Boss」區塊、以及 Boss 清單被 DB.bosses 泛用 zone 帶入過多的問題。
  規則：
  1) 怪物區只顯示一般怪物。
  2) Boss 區只顯示 map.bosses、map.mons 內明確 Boss 名稱、或 DB.bosses 有 map/mapId 明確對應的 Boss。
  3) 不再用 zone.includes(mapId) 或 mapName.includes(bossName) 這類寬鬆規則，避免龍谷帶出四龍全 Boss。
-->
<script>
(function(){
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const uniq=a=>[...new Set((a||[]).filter(v=>v!==undefined&&v!==null&&String(v).trim()!=='').map(v=>String(v).trim()))];
  const itemName=id=>(DB.item&&DB.item[id]?DB.item[id].name:id);
  const dropsOf=map=>uniq([...(map?.drops||[]),...(map?.materialDrops||[]),...(map?.skillBookDrops||[])]).filter(id=>DB.item&&DB.item[id]);
  const statName={str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',dmg:'傷害',hit:'命中',dr:'減傷',mr:'MR',spd:'速度',hp:'HP',mp:'MP',ac:'AC'};
  const statLine=o=>Object.entries(o||{}).map(([k,v])=>`${statName[k]||k}${Number(v)>=0?'+':''}${v}`).join('、')||'無';

  const BOSS_EXACT_RE=/^(安塔瑞斯|巴拉卡斯|法利昂|林德拜爾|吉爾塔斯|巴風特|巴風特侍徒|死亡騎士|巫妖|木乃伊王|吸血鬼|巨蟻女皇|不死鳥|惡魔|克特|賽尼斯|飛龍王|巨大飛龍|巨大骷髏|巨大守護螞蟻|騎士范德|黑暗大法師|烏格奴斯|鐮刀死神|地獄君主|遺忘之王|拉斯塔巴德君王|城主幻影|監獄長|船長|奧曼大將|修練首領)$/i;
  const BOSS_WORD_RE=/(首領|君主|女皇|大法師|死神|監獄長|城主|船長|大將|飛龍王|守護螞蟻|巴風特侍徒)$/i;

  function rewardForMapV42(map){
    const lv=Number(map?.min)||1;
    const key=String((map?.name||'')+' '+(map?.id||''));
    const fixed={talking:{hp:30},gludin:{ac:-1},giran:{dmg:1},dragon:{dmg:2,hit:1},toi:{dr:1,mr:5},lastabad:{dmg:2,dr:1},antharas:{hp:120,dr:2},valakas:{dmg:3,hp:80}};
    if(fixed[map?.id]) return fixed[map.id];
    if(/安塔|巴拉|法利|林德|四龍/i.test(key)) return {dmg:2,dr:1,hp:80};
    if(/傲慢|支配|遺忘|地獄|拉斯塔/i.test(key)) return {dmg:1,dr:1,mr:5};
    if(lv>=75) return {dmg:1,dr:1};
    if(lv>=45) return {hit:1,hp:50};
    if(lv>=20) return {hp:30};
    return {hp:15};
  }

  Game.versionLabel='V42';
  document.title='天堂M Core Rebuild V42｜地圖圖鑑分類修正版';
  const title=document.querySelector('#app .top .title'); if(title) title.textContent='天堂M Core Rebuild V42';
  const startTitle=document.querySelector('#start h1'); if(startTitle) startTitle.textContent='天堂M Core Rebuild V42';
  const startDesc=document.querySelector('#start p'); if(startDesc) startDesc.textContent='單機HTML｜V42 地圖圖鑑怪物與 Boss 分類修正版。';

  Game.mapBossNamesV42=function(map){
    map=map||this.map();
    const mapId=String(map?.id||'');
    const fromMapBosses=uniq(map?.bosses||[]);
    const fromMapMons=uniq(map?.mons||[]).filter(n=>BOSS_EXACT_RE.test(n)||BOSS_WORD_RE.test(n));
    const fromBossDb=uniq((DB.bosses||[]).filter(b=>{
      const bid=String(b.mapId||b.map||'');
      // 只接受明確 map/mapId 對應；不使用模糊 zone 避免跨地圖誤帶。
      return bid && bid===mapId;
    }).map(b=>b.name));
    return uniq([...fromMapBosses,...fromMapMons,...fromBossDb]);
  };

  Game.mapMonsterNamesV42=function(map){
    map=map||this.map();
    const bosses=this.mapBossNamesV42(map);
    return uniq(map?.mons||[]).filter(n=>!bosses.includes(n));
  };

  // 覆蓋舊版函式，確保所有既有 view / progress 都走新規則。
  Game.mapBossNamesV41=function(map){return this.mapBossNamesV42(map);};
  Game.mapMonsterNamesV41=function(map){return this.mapMonsterNamesV42(map);};
  Game.isBossNameV41=function(name,map){
    const n=String(name||'').trim(); if(!n) return false;
    return this.mapBossNamesV42(map||this.map()).includes(n) || BOSS_EXACT_RE.test(n) || BOSS_WORD_RE.test(n);
  };

  Game.rebuildCodexV42=function(showLog=true){
    this.ensure();
    (DB.maps||[]).forEach(m=>{
      this.s.mapMonsterSeen[m.id]=this.s.mapMonsterSeen[m.id]||{};
      this.s.mapBossSeen[m.id]=this.s.mapBossSeen[m.id]||{};
      const bosses=this.mapBossNamesV42(m);
      const monsters=this.mapMonsterNamesV42(m);
      // 清掉同一地圖下 Boss 被誤塞進怪物已見清單的狀態；不刪全域擊殺數。
      bosses.forEach(n=>{ if(this.s.mapMonsterSeen[m.id]) delete this.s.mapMonsterSeen[m.id][n]; });
      monsters.forEach(n=>{ if((this.s.codexMon[n]||0)>0) this.s.mapMonsterSeen[m.id][n]=true; });
      bosses.forEach(n=>{ if((this.s.codexBoss[n]||0)>0 || (this.s.codexMon[n]||0)>0) this.s.mapBossSeen[m.id][n]=true; });
      if((this.s.codexMap[m.id]||0)>0 || this.s.mapDiscovered[m.id]) this.s.mapDiscovered[m.id]=true;
    });
    this.s.version='core_rebuild_v42_mapbook_classification_fix';
    if(showLog) this.log('V42：地圖圖鑑怪物 / Boss 分類已修復','green');
    this.save(false);
    if(showLog) this.render();
  };

  const oldEnter=Game.enter;
  Game.enter=function(){ oldEnter.call(this); this.rebuildCodexV42(false); };

  const oldRenderStatus=Game.renderStatus;
  Game.renderStatus=function(){
    oldRenderStatus.call(this);
    const t=document.querySelector('#app .top .title'); if(t) t.textContent='天堂M Core Rebuild V42';
    const m=this.map?this.map():null, mi=this.$&&this.$('mapInfo');
    if(mi&&m){
      const monsters=this.mapMonsterNamesV42(m), bosses=this.mapBossNamesV42(m);
      const monSeen=monsters.filter(n=>(this.s.codexMon?.[n]||0)>0 || !!this.s.mapMonsterSeen?.[m.id]?.[n]).length;
      const bossSeen=bosses.filter(n=>(this.s.codexBoss?.[n]||0)>0 || !!this.s.mapBossSeen?.[m.id]?.[n] || (this.s.codexMon?.[n]||0)>0).length;
      mi.innerHTML=`<div><b>${esc(m.name)}</b> Lv.${m.min}-${m.max}</div><div>怪物 ${monsters.length}｜Boss ${bosses.length}｜登錄 ${monSeen+bossSeen}/${monsters.length+bosses.length}</div>`;
    }
  };

  const oldAction=Game.action;
  Game.action=function(a,arg,b){
    if(a==='rebuildCodexV42'||a==='rebuildCodexV41'||a==='rebuildCodexV40'){
      this.rebuildCodexV42(true);return;
    }
    return oldAction.call(this,a,arg,b);
  };

  Game.viewMapBookV23=function(){
    this.ensure();
    this.rebuildCodexV42(false);
    this.pageState=this.pageState||{};
    const q=String(this.pageState.mapDropSearch||'').trim().toLowerCase();
    const filter=this.pageState.mapRuleFilter||'all';
    let maps=(DB.maps||[]).slice();
    if(q){
      maps=maps.filter(m=>[
        m.name,m.id,...this.mapMonsterNamesV42(m),...this.mapBossNamesV42(m),...dropsOf(m).map(id=>itemName(id)),...dropsOf(m)
      ].join(' ').toLowerCase().includes(q));
    }
    if(filter==='current') maps=maps.filter(m=>m.id===this.s.map);
    if(filter==='ready') maps=maps.filter(m=>this.mapBookCanClaimV41(m)&&!(this.s.mapClaimed?.[m.id]||this.s.claimed?.['map_'+m.id]));
    if(filter==='claimed') maps=maps.filter(m=>this.s.mapClaimed?.[m.id]||this.s.claimed?.['map_'+m.id]);
    if(filter==='undiscovered') maps=maps.filter(m=>!this.s.mapDiscovered?.[m.id]);
    maps.sort((a,b)=>this.mapProgressV41(b).total-this.mapProgressV41(a).total || (a.min||0)-(b.min||0));
    const all=DB.maps||[];
    const readyCnt=all.filter(m=>this.mapBookCanClaimV41(m)&&!(this.s.mapClaimed?.[m.id]||this.s.claimed?.['map_'+m.id])).length;
    const claimedCnt=all.filter(m=>this.s.mapClaimed?.[m.id]||this.s.claimed?.['map_'+m.id]).length;
    const rows=maps.map(map=>{
      const p=this.mapProgressV41(map), active=this.s.map===map.id;
      const monsters=this.mapMonsterNamesV42(map), bosses=this.mapBossNamesV42(map);
      const claimed=!!(this.s.mapClaimed?.[map.id]||this.s.claimed?.['map_'+map.id]);
      const canClaim=this.mapBookCanClaimV41(map)&&!claimed;
      const monHtml=monsters.map(n=>{
        const k=this.s.codexMon?.[n]||0, seen=!!this.s.mapMonsterSeen?.[map.id]?.[n]||k>0;
        return `<span class="pill ${seen?'green':''}">${esc(n)} ${k}</span>`;
      }).join('')||'<span class="muted">此地圖尚未設定一般怪物</span>';
      const bossHtml=bosses.map(n=>{
        const k=Math.max(this.s.codexBoss?.[n]||0,this.s.codexMon?.[n]||0), seen=!!this.s.mapBossSeen?.[map.id]?.[n]||k>0;
        return `<span class="pill ${seen?'red':''}">${esc(n)} ${k}</span>`;
      }).join('')||'<span class="muted">此地圖無指定 Boss</span>';
      const dropHtml=dropsOf(map).map(id=>`<span class="pill ${q&&(String(itemName(id)).toLowerCase().includes(q)||String(id).toLowerCase().includes(q))?'gold':''}">${esc(itemName(id))}</span>`).join('')||'<span class="muted">無掉落資料</span>';
      return `<div class="map-v41-card ${active?'active':''} ${canClaim?'ready':''} ${claimed?'done':''}">
        <div class="row"><div><b class="gold">${esc(map.name)}</b> <span class="pill">Lv.${map.min}-${map.max}</span> ${claimed?'<span class="pill green">已領取</span>':canClaim?'<span class="pill red">可領取</span>':this.s.mapDiscovered?.[map.id]?'<span class="pill blue">已探索</span>':'<span class="pill">未探索</span>'}<br><span class="muted">獎勵：${esc(statLine(rewardForMapV42(map)))}</span></div><div><button data-act="goMap" data-arg="${esc(map.id)}" ${active?'disabled':''}>${active?'狩獵中':'前往'}</button> <button data-act="claimMapReward" data-arg="${esc(map.id)}" ${canClaim?'':'disabled'}>領取</button></div></div>
        <div class="bar"><i class="exp" style="width:${Math.max(0,Math.min(100,p.total))}%"></i><span>${p.total}%</span></div>
        <div class="map-v41-sub"><span>探索 ${p.explore}/100</span><span>怪物 ${p.monCount}/${monsters.length}</span><span>Boss ${p.bossCount}/${bosses.length}</span><span>掉落 ${dropsOf(map).length}</span></div>
        <details open><summary>地圖怪物</summary><div class="drop-box"><b>怪物</b>${monHtml}</div></details>
        <details open><summary>Boss</summary><div class="drop-box"><b>Boss</b>${bossHtml}</div></details>
        <details ${q?'open':''}><summary>掉落</summary><div class="drop-box"><b>掉落</b>${dropHtml}</div></details>
      </div>`;
    }).join('');
    const filters=[['all','全部'],['current','目前地圖'],['ready','可領取'],['claimed','已領取'],['undiscovered','未探索']];
    return (this.hero?this.hero('地圖圖鑑 V42','一般怪物與 Boss 已分開計算；Boss 不會再重複顯示在怪物區。','<button data-act="rebuildCodexV42" class="gold">重建圖鑑資料</button>'):'<h3 class="title">地圖圖鑑 V42</h3>')+
      (this.statCards?this.statCards([['地圖',all.length,'gold'],['已探索',all.filter(m=>this.s.mapDiscovered?.[m.id]).length+'/'+all.length,'green'],['可領取',readyCnt,'red'],['已領取',claimedCnt,'blue'],['顯示結果',maps.length,'cyan']]):'')+
      `<div class="card"><b class="gold">整理規則</b><div class="map-v41-rules"><span>怪物：只顯示一般怪物</span><span>Boss：只顯示明確 Boss</span><span>掉落：drops + materialDrops + skillBookDrops</span><span>修復：Boss 不再重複列入怪物</span></div></div>`+
      `<div class="card"><div class="row"><b>搜尋掉落 / 怪物 / Boss</b><input data-map-drop-search="1" value="${esc(this.pageState.mapDropSearch||'')}" placeholder="輸入道具、技能書、怪物、Boss、地圖名稱" style="min-width:280px;flex:1"></div></div>`+
      `<div class="tabs page-tabs">${filters.map(([id,n])=>`<button class="tab ${filter===id?'on':''}" data-act="mapRuleFilterV41" data-arg="${id}">${n}</button>`).join('')}</div>`+
      `<div class="page-list">${rows||'<p class="muted">沒有符合條件的地圖</p>'}</div>`;
  };
})();

  Store.key=SAVE_KEY;
